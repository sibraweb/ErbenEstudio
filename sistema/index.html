<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERBEN ESTUDIO</title>
<style>
/* ══ IDENTIDAD ERBEN ESTUDIO ══
   Del manual de marca: azul #2E5F85 · gris #A7AD83 · carbón #2B2F34 ·
   hueso #F5F5F2 · dorado #D0A64B. Tipografía Century Gothic.

   El DORADO es el acento: en el logo es el único color cálido y el que
   remata la marca, así que acá manda los botones y lo seleccionado. El AZUL
   queda de institucional (encabezados, foco), y el carbón de fondo.
   Usar el azul de acento competiría con el fondo y apagaría la marca. */
:root{
  --marca-azul:#2E5F85; --marca-oro:#D0A64B; --marca-gris:#A7AD83;
  --marca-carbon:#2B2F34; --marca-hueso:#F5F5F2;

  --bg:#1B1E22; --bg2:#22262B; --bg3:#2B2F34; --hover:#363B42;
  --bor:#3A4048; --bor2:#2B2F34;
  --txt:#F5F5F2; --txt2:#C6C9C4; --mut:#8A9098;
  --ac:#D0A64B; --ac2:#E0BC70; --warn:#D0A64B; --bad:#C4614C;
}
html.light{
  --bg:#F5F5F2; --bg2:#FFFFFF; --bg3:#EDEDE8; --hover:#E2E2DC;
  --bor:#D2D2CB; --bor2:#E8E8E2;
  --txt:#2B2F34; --txt2:#4A5058; --mut:#79808A;
  --ac:#A97F2C; --ac2:#8C6820;   /* el oro se oscurece en claro: sobre blanco no se lee */
}
*{margin:0;padding:0;box-sizing:border-box}
/* Century Gothic es la del manual y está en Windows. Las de respaldo son
   geométricas del mismo aire, para que no cambie el carácter si falta. */
body{background:var(--bg);color:var(--txt);
  font:14px/1.55 'Century Gothic','URW Gothic','Questrial','Futura','Trebuchet MS',sans-serif}
h2,.logo-txt b,.card .v{letter-spacing:.01em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}

.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:34px;height:34px;flex-shrink:0}
.logo-txt{line-height:1}
.logo-txt b{font-size:15px;font-weight:700;letter-spacing:.06em}
.logo-txt span{display:block;font-size:8px;letter-spacing:.34em;color:var(--marca-oro);
  margin-top:4px;text-transform:uppercase}

/* ── la fila de arriba: el filtro de empresa manda sobre todo ── */
header{background:var(--bg2);border-bottom:1px solid var(--bor2);padding:10px 16px;position:sticky;top:0;z-index:50}
.hd{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.filtro-empresa{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--ac);
  border-radius:9px;padding:5px 8px 5px 13px;flex:1;max-width:560px;min-width:260px}
.filtro-empresa .et{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}
.filtro-empresa select{background:transparent;border:0;font-size:14.5px;font-weight:700;padding:4px 2px;
  flex:1;min-width:0;cursor:pointer}
.filtro-empresa select:focus{outline:0}
.cuit-chip{font-size:11px;color:var(--mut);white-space:nowrap;flex-shrink:0}
nav{background:var(--bg2);border-bottom:1px solid var(--bor2);padding:0 16px;overflow-x:auto}
.nav{max-width:1500px;margin:0 auto;display:flex;gap:2px}
.nav a{padding:11px 13px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--txt)}
.nav a.on{color:var(--ac2);border-bottom-color:var(--ac)}
main{max-width:1500px;margin:0 auto;padding:22px 16px 60px}
h2{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.card{background:var(--bg2);border:1px solid var(--bor);border-radius:10px;padding:15px}
.card .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.card .v{font-size:22px;font-weight:700;margin-top:6px}
.card .v.sm{font-size:16px}
.panel{background:var(--bg2);border:1px solid var(--bor);border-radius:10px;margin-bottom:16px;overflow:hidden}
.panel-h{padding:12px 15px;border-bottom:1px solid var(--bor2);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h b{font-size:14px}
.panel-b{padding:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:11px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.05em;border-bottom:1px solid var(--bor);white-space:nowrap}
th[data-col]{cursor:pointer;user-select:none;position:relative;padding-right:20px}
th[data-col]:hover{color:var(--txt)}
th[data-col]::after{content:'⇅';position:absolute;right:7px;opacity:.28;font-size:10px}
th[data-col][data-orden="asc"]::after{content:'↑';opacity:1;color:var(--ac)}
th[data-col][data-orden="desc"]::after{content:'↓';opacity:1;color:var(--ac)}
td{padding:9px 12px;border-bottom:1px solid var(--bor2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
tr.click{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla-wrap{overflow-x:auto}
button{background:var(--marca-oro);color:#2B2F34;border:0;border-radius:6px;padding:8px 14px;
  font-size:13px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.02em}
button:hover{background:#E0BC70}
button.g{background:var(--bg3);color:var(--txt2);border:1px solid var(--bor)}
button.g:hover{background:var(--hover);color:var(--txt)}
button.xs{padding:4px 9px;font-size:11.5px;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.f{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.f .full{grid-column:1/-1}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:rgba(46,95,133,.22);color:#7FB2DA}
.b-warn{background:rgba(208,166,75,.18);color:var(--marca-oro)}
.b-bad{background:rgba(196,97,76,.18);color:#E28873}
.b-mut{background:var(--bg3);color:var(--mut)}
.vacio{padding:32px 16px;text-align:center;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--bor);overflow-x:auto}
.tabs button{background:none;color:var(--mut);border:0;border-bottom:2px solid transparent;
  border-radius:0;padding:8px 14px;font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ac2);border-bottom-color:var(--ac)}
.pos{color:#7FB2DA} .neg{color:#E28873} .amb{color:var(--marca-oro)}
.mini{font-size:11.5px;color:var(--mut)}
.aviso{background:var(--bg2);border:1px solid var(--bor);border-left:3px solid var(--ac);
  border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--txt2);margin-bottom:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);
  border:1px solid var(--ac);border-radius:8px;padding:11px 18px;font-size:13px;z-index:200;display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.hide{display:none!important}
/* Depositar y endosar pedían los datos con prompt(): había que acordarse del
   número de la cuenta o de la entidad y escribirlo bien. Es el mismo error que
   el ERP ya corrigió — se elige de una lista, no se transcribe. */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--bg2);border:1px solid var(--bor);border-radius:10px;
  max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal .box h3{margin:0 0 4px;font-size:15px}
.row-act{display:flex;gap:5px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;
  color:var(--txt);margin:4px 0;cursor:pointer}
.chk input{width:auto;flex:none}
.cand{background:var(--bg3);border:1px solid var(--bor);border-radius:7px;padding:8px 11px;margin-top:6px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px}
.cadena{font-size:11.5px;color:var(--mut);margin-top:3px}
.cadena i{font-style:normal;color:var(--ac2)}
#arranque{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
</style>
</head>
<body>

<header><div class="hd">
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 100 100" aria-label="ERBEN ESTUDIO">
        <g>
          <path d="M50 6 L50 22 L14 48 L4 41 Z" fill="#2E5F85"/>
          <path d="M50 6 L50 22 L86 48 L96 41 Z" fill="#A7AD83"/>
          <path d="M50 32 L50 48 L14 74 L4 67 Z" fill="#2E5F85"/>
          <path d="M50 32 L50 48 L86 74 L96 67 Z" fill="#A7AD83"/>
          <path d="M50 58 L50 74 L14 100 L4 93 Z" fill="#2E5F85"/>
          <path d="M50 58 L50 74 L86 100 L96 93 Z" fill="#A7AD83"/>
          <path d="M4 93 L14 100 L4 100 Z" fill="#D0A64B"/>
        </g>
      </svg>
    <div class="logo-txt"><b>ERBEN ESTUDIO</b><span>Forjando legado</span></div>
  </div>
  <!-- EL FILTRO: se elige una empresa y TODOS los módulos filtran por ella.
       No hay ALL: el sistema trabaja con una sola empresa por vez. -->
  <div class="filtro-empresa">
    <span class="et">Empresa</span>
    <select id="sel-empresa" onchange="cambiarEmpresa(this.value)"></select>
    <span class="cuit-chip" id="cuit-chip"></span>
  </div>
  <button class="g xs" onclick="tema()">◐ Tema</button>
</div></header>

<nav><div class="nav" id="nav"></div></nav>
<main id="vista"><div id="arranque">Cargando…</div></main>
<div id="toast"></div>

<script>
let CLI = null, CLIENTES = [], ACT = [], ENT = [], CTAS = [];

const MODULOS = [
  ['tesoreria',    'Tesorería'],
  ['facturas',     'Facturas'],
  ['bancos',       'Bancos'],
  ['cheques',      'Cheques'],
  ['pagos',        'Pagos'],
  // Conciliación NO es un módulo suelto: vive DENTRO de Tesorería, como en el
  // Conciliar es cruzar plata: por eso vive dentro de Tesorería, no aparte.
  ['impuestos',    'Impuestos'],
  ['iibb',         'DJ IIBB'],
  ['entidades',    'Entidades'],
  ['panel',        'Panel'],
  ['clientes',     'Clientes del estudio'],
];

/* ── utilidades ── */
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plata = n => (n == null ? '—' : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('es-AR',
  {minimumFractionDigits:2, maximumFractionDigits:2}));
const fecha = f => !f ? '—' : f.slice(0,10).split('-').reverse().join('/');
const hoy = () => new Date().toISOString().slice(0,10);
const periodoHoy = () => { const d = new Date(); return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
function toggle(sel){ $(sel).classList.toggle('hide'); }
/* Un formulario chico encima de la pantalla. Devuelve una promesa: resuelve con
   los valores de los campos, o con null si se cancela. */
function modal(titulo, ayuda, campos, textoOk = 'Aceptar'){
  return new Promise(res => {
    const d = document.createElement('div');
    d.className = 'modal';
    d.innerHTML = `<div class="box"><h3>${esc(titulo)}</h3>
      <div class="mini" style="margin-bottom:12px">${ayuda}</div>
      <div class="f">${campos.map(c => `<div class="${c.ancho || 'full'}">
        <label>${esc(c.label)}</label>${c.html}</div>`).join('')}</div>
      <div class="row-act" style="justify-content:flex-end;margin-top:16px">
        <button class="g" id="md-no">Cancelar</button>
        <button id="md-si">${esc(textoOk)}</button></div></div>`;
    document.body.appendChild(d);
    const cerrar = v => { d.remove(); res(v); };
    d.querySelector('#md-no').onclick = () => cerrar(null);
    d.onclick = e => { if (e.target === d) cerrar(null); };
    d.querySelector('#md-si').onclick = () =>
      cerrar(Object.fromEntries(campos.map(c => [c.id, val(c.id)])));
    setTimeout(() => d.querySelector('input,select')?.focus(), 30);
  });
}
function tema(){ document.documentElement.classList.toggle('light');
  localStorage.setItem('ee-tema', document.documentElement.className); }
function toast(msg, malo){
  const t = $('#toast'); t.textContent = msg;
  t.style.borderColor = malo ? 'var(--bad)' : 'var(--ac)';
  t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', 3800);
}
// Toda respuesta que llega TARDE se abandona. Sin esto, cambiar de empresa (o
// de módulo) mientras algo está cargando deja que la respuesta vieja pinte
// encima de la nueva: se vio la pantalla de Impuestos con el módulo en Cheques
// En un sistema donde cada empresa es un compartimiento estanco,
// una pintada tardía es lo más parecido a un dato filtrado — así que la
// promesa se abandona en silencio y ese render nunca termina.
// ── DÓNDE ESTÁ LA API ──
// La pantalla puede venir de dos lados: servida por el equipo local (mismo
// origen, ruta relativa) o publicada en la nube. En el segundo caso la API
// SIGUE SIENDO LA LOCAL: los datos del cliente nunca pasan por internet —
// el navegador habla directo con la máquina del estudio.
const API = (function(){
  const guardado = localStorage.getItem('ee-api');
  if (guardado !== null) return guardado;
  const local = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  return local ? '' : 'http://localhost:8310';
})();

const marca = () => (location.hash || '') + '|' + (CLI ? CLI.alias : '');
async function api(ruta, opts){
  const sep = ruta.includes('?') ? '&' : '?';
  const url = API + ruta + (CLI && ruta.startsWith('/api/c/') ? sep + 'cliente=' + encodeURIComponent(CLI.alias) : '');
  const antes = marca();
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({error:'respuesta ilegible del servidor'}));
  if (marca() !== antes && !(opts && opts.method === 'POST')) return new Promise(() => {});
  if (!r.ok) throw new Error(j.error || ('error ' + r.status));
  return j;
}
const post = (ruta, cuerpo) => api(ruta, {method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify(cuerpo)});
const val = id => ($('#'+id)?.value ?? '').trim();
const num = id => { const v = val(id); return v === '' ? null : parseFloat(v.replace(',','.')); };
function tabla(cols, filas, opts){
  return `<div class="tabla-wrap"><table><thead><tr>${
    cols.map(c => `<th data-col${/importe|monto|total|base|saldo|debo|debe|aplicado/i.test(c) ? ' class="num"' : ''}>${c}</th>`).join('')
  }</tr></thead><tbody>${filas.map((f,i) => `<tr${opts?.onclick ? ` class="click" onclick="${opts.onclick(i)}"` : ''}>${
    f.map(c => typeof c === 'object' && c?.n !== undefined ? `<td class="num">${c.n}</td>` : `<td>${c}</td>`).join('')
  }</tr>`).join('')}</tbody></table></div>`;
}
/* ══ ORDENAR CUALQUIER TABLA POR SU ENCABEZADO ══
   Traído de `ERP/shared/tabla-orden.js` (pedido de Juan, 21/08). Acá no hay
   filas de detalle, así que esa parte no se porta; sí las otras dos trampas,
   que son las que rompen un ordenador ingenuo:

   1. LOS NÚMEROS ARGENTINOS: «$ 1.234,56» como texto pone 1.000 antes que 999.
      El punto agrupa y la coma decide los centavos, al revés que en inglés.
   2. LAS FECHAS dd/mm/aaaa: como texto, 02/01/2026 va antes que 15/12/2025.

   Y una tercera propia: las celdas traen HTML (pastillas, botones), así que se
   compara por el TEXTO visible, no por el markup. */
function valorCelda(td){
  if (!td) return null;
  const crudo = (td.getAttribute('data-orden') ?? td.textContent ?? '').trim();
  if (!crudo || crudo === '—' || crudo === '-') return null;   // vacíos al final

  const dmy = crudo.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (dmy) return Number(dmy[3] + dmy[2].padStart(2,'0') + dmy[1].padStart(2,'0'));
  const iso = crudo.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return Number(iso[1] + iso[2] + iso[3]);

  const limpio = crudo.replace(/[$\s ]/g,'');
  if (/^-?[\d.]+(,\d+)?$/.test(limpio)){
    const n = Number(limpio.replace(/\./g,'').replace(',','.'));
    if (!isNaN(n)) return n;
  }
  if (/^-?\d+(\.\d+)?$/.test(limpio)) return Number(limpio);
  return crudo.toLocaleLowerCase('es-AR');
}
function compararCeldas(a, b){
  // los vacíos SIEMPRE al final: una fila sin fecha arriba de todo no sirve
  if (a === null && b === null) return 0;
  if (a === null) return 1;
  if (b === null) return -1;
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b), 'es-AR', {numeric:true});
}
function ordenarTabla(th){
  const tabla = th.closest('table'), cuerpo = tabla.tBodies[0];
  if (!cuerpo) return;
  const i = [...th.parentNode.children].indexOf(th);
  const desc = th.getAttribute('data-orden') === 'asc';
  th.parentNode.querySelectorAll('th[data-col]').forEach(x => x.removeAttribute('data-orden'));
  th.setAttribute('data-orden', desc ? 'desc' : 'asc');

  // el índice original desempata: filas iguales no se barajan solas
  const filas = [...cuerpo.rows].map((tr, n) => ({tr, clave: valorCelda(tr.cells[i]), n}));
  filas.sort((x, y) => {
    const c = compararCeldas(x.clave, y.clave);
    return c !== 0 ? (desc ? -c : c) : x.n - y.n;
  });
  const frag = document.createDocumentFragment();
  filas.forEach(f => frag.appendChild(f.tr));
  cuerpo.appendChild(frag);
}
// Un solo listener en el documento: sobrevive a que cualquier vista se repinte.
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (th) ordenarTabla(th);
});

function badgeEstado(e){
  const cls = {pendiente:'b-warn', presentado:'b-ok', pagado:'b-ok', en_cartera:'b-ok', emitido:'b-warn',
    depositado:'b-mut', endosado:'b-mut', debitado:'b-mut', cobrado:'b-mut', rechazado:'b-bad',
    anulado:'b-bad', borrador:'b-warn', presentada:'b-ok', saldada:'b-ok', saldado:'b-ok',
    impaga:'b-warn', conciliado:'b-ok', 'sin registrar':'b-warn', 'sin aplicar':'b-warn',
    parcial:'b-warn', imputado:'b-ok', 'a cuenta':'b-warn', 'le debés':'b-bad', 'te debe':'b-warn',
    cruzado:'b-warn'}[e] || 'b-mut';
  return `<span class="badge ${cls}">${esc((e||'').replace(/_/g,' '))}</span>`;
}
function colorFecha(f){
  if (!f) return '';
  const h = hoy(), m = new Date(Date.now()+86400000).toISOString().slice(0,10);
  return f < h ? 'neg' : (f <= m ? 'amb' : '');
}

/* ── el filtro de empresa: manda sobre todos los módulos ── */
async function arrancar(){
  try{ CLIENTES = await api('/api/clientes'); }
  catch(e){ return sinEquipoLocal(e); }
  if (!CLIENTES.length){
    $('#sel-empresa').innerHTML = '<option>— sin clientes —</option>';
    $('#nav').innerHTML = MODULOS.filter(m => m[0]==='clientes')
      .map(([k,t]) => `<a href="#${k}" id="nav-${k}" class="on">${t}</a>`).join('');
    return vClientes();
  }
  $('#sel-empresa').innerHTML = CLIENTES.map(c =>
    `<option value="${esc(c.alias)}">${esc(c.razon_social)}</option>`).join('');
  $('#nav').innerHTML = MODULOS.map(([k,t]) => `<a href="#${k}" id="nav-${k}">${t}</a>`).join('');
  const guardado = localStorage.getItem('ee-empresa');
  const inicial = CLIENTES.find(c => c.alias === guardado) || CLIENTES[0];
  await cambiarEmpresa(inicial.alias, true);
}
/* El modo de falla obvio cuando la pantalla vive en la nube: el equipo del
   estudio está apagado. Decirlo con todas las letras — un "error de red" hace
   que la gente crea que se perdieron los datos. */
function sinEquipoLocal(e){
  const enLaNube = API !== '';
  $('#sel-empresa').innerHTML = '<option>— sin conexión —</option>';
  $('#nav').innerHTML = '';
  $('#vista').innerHTML = `
    <div class="panel" style="max-width:640px;margin:40px auto;border-left:3px solid var(--warn)">
      <div class="panel-h"><b>No encuentro el equipo del estudio</b></div>
      <div class="panel-b">
        ${enLaNube ? `
          <p style="margin-bottom:10px">Esta pantalla vive en internet, pero <b>los datos están en la
            computadora del estudio</b> y no pasan por la nube. Para trabajar, esa máquina tiene que
            estar prendida con el sistema abierto.</p>

/* ══ BUSCAR UNA ENTIDAD POR NOMBRE, CUIT O ALIAS ══
   Traído de `ERP/shared/entidades.js`. Juan (31/08): «Chipi es Fabián Alcaraz
   pero es más fácil escribir chipi. El sistema genera con nombre y CUIT, pero
   buscarlos que sea por ambos».

   ⚠ El alias sirve para BUSCAR, no para decidir identidad: si un alias apunta
   a dos entidades, se ofrecen las dos y elige la persona. Elegir solo sería
   imputarle una factura al que no es. */
function normEnt(s){
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function coincideEntidad(e, q){
  const n = normEnt(q);
  if (!n) return true;
  return normEnt(e.razon_social).includes(n)
      || normEnt(e.cuit).includes(n)
      || normEnt(e.alias_interno).includes(n);
}
function etiquetaEntidad(e){
  const ali = e.alias_interno && normEnt(e.alias_interno) !== normEnt(e.razon_social)
    ? ` · (${e.alias_interno})` : '';
  return `${e.razon_social}${e.cuit ? ' · ' + e.cuit : ''}${ali}`;
}

const optEnt = (f = () => true, q = '') => ENT.filter(f).filter(e => coincideEntidad(e, q))

const optCta = () => CTAS.map(c =>

          `${esc(d.detalle)}${d.cadena.length ? `<div class="cadena">↳ ${d.cadena.map(c => `<i>${esc(c)}</i>`).join(' · ')}</div>`
            : `<div class="cadena">↳ se aplica con ${esc(d.se_aplica_con)}</div>`}`,
          esc(d.entidad), badgeEstado(d.estado),
          // Un PAGO no tiene neto ni IVA: es por el total. Poner un 0 ahí sería
          // decir que su IVA es cero, y lo que pasa es que no aplica.
          {n: d.neto == null ? '—' : plata(d.neto)},
          {n: d.iva == null ? '—' : plata(d.iva)},
          {n:`<span class="${d.flujo==='egreso'?'neg':'pos'}">${plata(d.total)}</span>`},
          {n: d.saldo == null ? '—' : plata(d.saldo)}]))
        : '<div class="vacio">Sin documentos con ese filtro.</div>'}
    </div>`);
}

/* ── EL GRÁFICO: acumulado a favor (línea) + posición del mes (barras) ──
   Traído del módulo Facturas del ERP, con la paleta de ERBEN.

   ⚠ EL SALDO A FAVOR NO ES UNA BUENA NOTICIA (Juan, 31/08: «cuando la línea
   anda por posición a favor que esté roja»). La línea nunca es negativa: es
   plata que YA se pagó de más y queda parada en ARCA hasta que un débito la
   consuma. Pintarla como algo bueno la lee como "vamos bien"; es capital
   inmovilizado. Por eso el tramo va en rojo en cuanto alguna de sus dos puntas
   tiene saldo, y en azul solo cuando cierra en cero.

   ⚠ Las dos escalas son distintas A PROPÓSITO: el acumulado es mucho más
   grande que el mes suelto y con una sola escala las barras no se verían. El
   aire de arriba (34px, no 18) es para el título de cada eje: sin eso los dos
   topes quedan pegados y se leen como si fueran el mismo número — pasó en el
   ERP y costó un rato entender que los dos estaban bien. */
function graficoIVA(serie){
  if (!serie.length) return '<div class="vacio">Sin meses para graficar.</div>';
  const datos = [...serie].reverse();               // del más viejo al más nuevo
  const W = Math.max(680, datos.length * 54), H = 316;
  const M = {arriba:34, abajo:46, izq:84, der:84};
  const ancho = W - M.izq - M.der, alto = H - M.arriba - M.abajo;

  const maxAcum = Math.max(...datos.map(f => f.saldo_favor_final), 1);
  const topePos = Math.max(...datos.map(f => Math.abs(f.posicion)), 1);
  const x = i => M.izq + (datos.length === 1 ? ancho/2 : (i*ancho)/(datos.length-1));
  const yAcum = v => M.arriba + alto - (v/maxAcum)*alto;
  const cero = M.arriba + alto/2;                   // el 0 de las barras, al medio
  const yPos = v => cero - (v/topePos)*(alto/2);

  const ROJO = '#E28873', AZUL = '#7FB2DA', LINEA = 'var(--bor)', MUT = 'var(--mut)';
  const enFavor = v => (v||0) > 0.01;

  const ab = Math.min(26, ancho/Math.max(datos.length,1)*0.5);
  const barras = datos.map((f,i) => {
    const y = yPos(f.posicion), h = Math.abs(y - cero);
    return `<rect x="${x(i)-ab/2}" y="${Math.min(y,cero)}" width="${ab}"
        height="${Math.max(h,1)}" fill="${f.posicion>0?ROJO:AZUL}" opacity=".75"
      ><title>${f.periodo}\nPosición del mes: ${plata(f.posicion)}${
        f.a_pagar ? '\nA pagar: '+plata(f.a_pagar) : ''}</title></rect>`;
  }).join('');

  const linea = datos.slice(1).map((f,k) => {
    const i = k+1, a = datos[i-1];
    const color = (enFavor(a.saldo_favor_final) || enFavor(f.saldo_favor_final)) ? ROJO : AZUL;
    return `<path d="M${x(i-1)},${yAcum(a.saldo_favor_final)} L${x(i)},${yAcum(f.saldo_favor_final)}"
      fill="none" stroke="${color}" stroke-width="2.5"/>`;
  }).join('');
  const puntos = datos.map((f,i) => `<circle cx="${x(i)}" cy="${yAcum(f.saldo_favor_final)}" r="3.5"
      fill="${enFavor(f.saldo_favor_final)?ROJO:AZUL}"
    ><title>${f.periodo}\nSaldo a favor acumulado: ${plata(f.saldo_favor_final)}${
      enFavor(f.saldo_favor_final) ? '\n(plata inmovilizada en ARCA)' : ''}</title></circle>`).join('');

  // Una etiqueta cada N para que no se pisen cuando son 20 meses.
  const cada = Math.ceil(datos.length/14);
  const etiq = datos.map((f,i) => i % cada ? '' : `<text x="${x(i)}" y="${H-26}"
      text-anchor="middle" font-size="9" fill="${MUT}"
      transform="rotate(-40 ${x(i)} ${H-26})">${f.periodo}</text>`).join('');

  const ult = datos[datos.length-1], colUlt = enFavor(ult.saldo_favor_final) ? ROJO : AZUL;
  return `<div style="overflow-x:auto">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">
      <line x1="${M.izq}" y1="${cero}" x2="${W-M.der}" y2="${cero}" stroke="${LINEA}"/>
      <line x1="${M.izq}" y1="${M.arriba}" x2="${M.izq}" y2="${M.arriba+alto}" stroke="${LINEA}"/>
      <line x1="${W-M.der}" y1="${M.arriba}" x2="${W-M.der}" y2="${M.arriba+alto}" stroke="${LINEA}"/>
      ${barras}${linea}${puntos}${etiq}
      <!-- Anclado a la IZQUIERDA y no al eje: con text-anchor="end" el rótulo
           se salía del viewBox y quedaba cortado ("CUMULADO" en vez de
           "ACUMULADO"). -->
      <text x="2" y="${M.arriba-12}" font-size="9"
        font-weight="600" fill="${enFavor(maxAcum)?ROJO:AZUL}">A FAVOR ACUMULADO (línea)</text>
      <text x="${W-M.der+6}" y="${M.arriba-12}" font-size="9" font-weight="600"
        fill="${MUT}">MES (barras)</text>
      <line x1="${M.izq-4}" y1="${M.arriba}" x2="${M.izq}" y2="${M.arriba}" stroke="${enFavor(maxAcum)?ROJO:AZUL}"/>
      <text x="${M.izq-6}" y="${M.arriba+3}" text-anchor="end" font-size="9"
        fill="${enFavor(maxAcum)?ROJO:AZUL}">${plata(maxAcum)}</text>
      <text x="${M.izq-6}" y="${M.arriba+alto+3}" text-anchor="end" font-size="9" fill="${MUT}">0</text>
      <line x1="${W-M.der}" y1="${yPos(topePos)}" x2="${W-M.der+4}" y2="${yPos(topePos)}" stroke="${ROJO}"/>
      <text x="${W-M.der+6}" y="${yPos(topePos)+3}" font-size="9" fill="${ROJO}">${plata(topePos)}</text>
      <line x1="${W-M.der}" y1="${yPos(-topePos)}" x2="${W-M.der+4}" y2="${yPos(-topePos)}" stroke="${AZUL}"/>
      <text x="${W-M.der+6}" y="${yPos(-topePos)+3}" font-size="9" fill="${AZUL}">${plata(-topePos)}</text>
      <text x="${W-M.der+6}" y="${cero+3}" font-size="9" fill="${MUT}">0</text>
      <text x="${W-M.der-8}" y="${yAcum(ult.saldo_favor_final)-8}" text-anchor="end"
        font-size="11" font-weight="700" fill="${colUlt}">${plata(ult.saldo_favor_final)}</text>
    </svg>
    <div class="mini" style="margin-top:6px">
      <b style="color:${ROJO}">— línea</b>: saldo a favor acumulado (eje izquierdo) ·
      <b>barras</b>: posición de cada mes (eje derecho) — <span style="color:${ROJO}">roja</span> se paga,
      <span style="color:${AZUL}">azul</span> queda a favor. Pasá el mouse para ver los números.
      <br>Las dos escalas son distintas a propósito: el acumulado es mucho más grande que el mes
      suelto y con una sola escala las barras no se verían.
      <br><b>La línea en rojo no es buena noticia:</b> es plata ya pagada que quedó parada en ARCA.
    </div></div>`;
}

/* ── LA POSICIÓN: la cadena entera, que es lo único que se puede auditar ──
   Traída del módulo Facturas del ERP. Un mes suelto no dice nada: el saldo a
   favor de julio depende de todos los meses anteriores. */
async function fPosicion(){
  const p = await api('/api/c/iva/posicion');
  panelF(`
    <div class="grid">
      <div class="card"><div class="k">Saldo a favor hoy</div>
        <div class="v sm pos">${plata(p.saldo_favor_hoy)}</div>
        <div class="mini">arrastrado al ${(p.actual||{}).periodo || '—'}</div></div>
      <div class="card"><div class="k">Meses liquidados</div><div class="v">${p.serie.length}</div></div>
      <div class="card"><div class="k">Total a pagar</div>
        <div class="v sm ${p.total_a_pagar?'neg':''}">${plata(p.total_a_pagar)}</div>
        <div class="mini">suma de los meses con posición a pagar</div></div>
      <div class="card"><div class="k">Arranca en</div>
        <div class="v sm">${p.inicial ? esc(p.inicial.periodo) : ((p.serie[p.serie.length-1]||{}).periodo || '—')}</div>
        <div class="mini">${p.inicial ? 'con ' + plata(p.inicial.a_favor) + ' a favor' : 'sin saldo declarado'}</div></div>
    </div>
    ${(() => { const sc = p.serie.reduce((s,f) => s + (f.sin_clasificar||0), 0);
      return sc > 0.01 ? `<div class="aviso" style="margin-top:16px;border-left-color:var(--bad)">
        <b>${plata(sc)} en tributos sin clasificar.</b> Es la columna «Otros Tributos» del
        export de ARCA: ahí adentro puede haber percepción de IVA, de IIBB o tasas municipales,
        y cada una va contra una DJ distinta. Mientras no se diga de qué es, <b>no se computa
        en ninguna</b> — que es lo honesto: restarla del IVA sin saber mostraba menos impuesto
        del que hay. Se clasifica en <a href="#facturas">Facturas → Compras</a>.</div>` : ''; })()}
    <div class="aviso" style="margin-top:16px;border-left-color:var(--bad)">
      <b>Falta un dato que ningún comprobante trae.</b> ${esc(p.falta)}</div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><b>Acumulado a favor y posición de cada mes</b></div>
      <div class="panel-b">${graficoIVA(p.serie)}</div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><b>Mes a mes</b>
      <button class="g xs" onclick="declararInicial()">Declarar el saldo que venía de antes</button></div>
      ${p.serie.length ? tabla(['Período','Débito','Crédito','Percep.','Posición','A favor anterior','A PAGAR','A favor final'],
        p.serie.map(f => [
          `<b>${esc(f.periodo)}</b><div class="mini">${f.ventas} vta · ${f.compras} cmp</div>`,
          {n: f.debito ? plata(f.debito) : '—'},
          {n: f.credito ? plata(f.credito) : '—'},
          {n: f.percepciones ? plata(f.percepciones) : '—'},
          {n: `<span class="${f.posicion>0?'neg':'pos'}">${plata(f.posicion)}</span>`},
          {n: f.saldo_favor_anterior ? `<span class="pos">${plata(f.saldo_favor_anterior)}</span>` : '—'},
          {n: f.a_pagar ? `<b class="neg">${plata(f.a_pagar)}</b>` : '—'},
          {n: f.saldo_favor_final ? `<span class="pos">${plata(f.saldo_favor_final)}</span>` : '—'}]))
        : '<div class="vacio">Sin comprobantes cargados.</div>'}
      <div class="panel-b"><div class="mini">${esc(p.nota)}</div></div>
    </div>`);
}

/* El saldo a favor con el que el cliente llegó al estudio no está en ningún
   comprobante: sale de la última DJ que presentó antes. Si no se declara, el
   arrastre arranca en cero y le hace perder un crédito que tenía. */
async function declararInicial(){
  const r = await modal('El saldo a favor que venía de antes',
    'Sale de la última DJ de IVA presentada antes de que el estudio tomara al cliente. '
    + 'Sin esto, el arrastre arranca en cero.', [
    {id:'md-per', label:'Primer período que liquida el estudio (MM/AAAA)',
     html:'<input id="md-per" placeholder="01/2026">', ancho:''},
    {id:'md-fav', label:'Saldo a favor que traía', html:'<input id="md-fav" type="number" step="0.01" value="0">'},
    {id:'md-nota', label:'De dónde sale (opcional)', html:'<input id="md-nota" placeholder="DJ 12/2025">'}
  ], 'Guardar');
  if (!r) return;
  try{ await post('/api/c/iva/inicial', {periodo:r['md-per'], a_favor:parseFloat(r['md-fav'])||0,
        nota:r['md-nota']});
    toast('Guardado — la cadena se recalcula'); fPosicion();
  }catch(e){ toast(e.message, true); }
}

function calcIVA(){
  const neto = num('nf-neto') || 0, a = parseFloat(val('nf-alic')) || 0;
  $('#nf-iva').value = (neto * a / 100).toFixed(2); calcTotal();
}
function calcTotal(){
  $('#nf-total').value = ((num('nf-neto')||0) + (num('nf-iva')||0) + (num('nf-perc')||0)).toFixed(2);
}
async function altaFactura(){
  try{
    const cuerpo = {mov: fMov, entidad_id: +val('nf-ent'), fecha: val('nf-fecha'), tipo: val('nf-tipo'),
      letra: val('nf-letra'), punto_venta: val('nf-pv'), numero: val('nf-num'),
      neto: num('nf-neto'), alicuota_iva: num('nf-alic'), iva: num('nf-iva'),
      percepciones: num('nf-perc'), total: num('nf-total')};

function abrirChq(cual){
  $(cual === 'rec' ? '#ch-emi' : '#ch-rec').classList.add('hide');
  toggle('#ch-' + cual);
  if (cual === 'rec') chImpagasDe();
}

/* El tilde COPIA el cliente al librador y bloquea los campos: queda escrito que
   lo firmó él porque alguien lo dijo, no porque el sistema lo haya supuesto. */
function chLibradorIgual(){
  const igual = $('#nr-lib-igual').checked;
  const e = ENT.find(x => x.id === +val('nr-ent'));
  const nom = $('#nr-lib-nom'), cuit = $('#nr-lib-cuit');
  if (igual && !e){ $('#nr-lib-igual').checked = false; return toast('Elegí primero el cliente', true); }
  if (igual){ nom.value = e.razon_social; cuit.value = e.cuit || ''; }
  else { nom.value = ''; cuit.value = ''; }
  nom.disabled = cuit.disabled = igual;
}

async function chImpagasDe(){
  const cont = $('#nr-facturas'); if (!cont) return;
  if ($('#nr-lib-igual')?.checked) chLibradorIgual();
  const eid = +val('nr-ent');
  if (!eid){ chImpagas = []; cont.textContent = 'Elegí un cliente…'; return; }
  chImpagas = (await api('/api/c/facturas?mov=venta&impagas=1')).filter(f => f.entidad_id === eid);
  cont.innerHTML = chImpagas.length ? chImpagas.map((f,i) => `
    <label class="chk">
      <input type="checkbox" id="nrf-${i}" onchange="chSumar()">
      ${esc(f.tipo)} ${esc(f.punto_venta||'')}-${esc(f.numero||'')} · ${fecha(f.fecha)} ·
      saldo <b>${plata(f.saldo)}</b></label>`).join('')
    + '<div class="mini" style="margin-top:6px">Si no tildás ninguna, la cobranza queda <b>a cuenta</b> y se imputa después.</div>'
    : '<span class="mini">No tiene facturas impagas — la cobranza va a quedar a cuenta.</span>';
}
/* El importe del cheque se propone con lo que suman las facturas tildadas: casi
   siempre es eso, y si no, se pisa a mano. */
function chSumar(){
  const t = chImpagas.reduce((s,f,i) => s + ($('#nrf-'+i)?.checked ? f.saldo : 0), 0);
  const inp = $('#nr-imp'); if (inp && t) inp.value = t.toFixed(2);
}

async function altaChequeRecibido(){
  const aplicaciones = chImpagas.map((f,i) => $('#nrf-'+i)?.checked ? {factura_id:f.id, importe:f.saldo} : null)
    .filter(Boolean);
  try{
    await post('/api/c/pagos', {direccion:'cobro', entidad_id:+val('nr-ent'),
      fecha: val('nr-fecha'), numero: val('nr-recibo'), aplicaciones,
      medios:[{medio:'cheque', importe:num('nr-imp'), cheque:{
        numero: val('nr-num'), banco: val('nr-banco'),
        fecha_emision: val('nr-fe'), fecha_pago: val('nr-fp'),
        librador_nombre: val('nr-lib-nom'), cuit_librador: val('nr-lib-cuit')}}]});
    toast('Cheque en cartera — quedó su recibo de cobranza'); vCheques();
  }catch(e){ toast(e.message, true); }
}

      <button onclick="abrirPago('pago')">+ Nuevo pago</button>
      <button class="g" onclick="abrirPago('cobro')">+ Nueva cobranza</button>
    </div>
    <div class="panel hide" id="p-alta"><div class="panel-h">
      <b id="p-titulo">${pDir==='pago'?'Nuevo pago a proveedor':'Nueva cobranza de cliente'}</b>
      <button class="g xs" onclick="toggle('#p-alta')">Cerrar</button></div>
      <div class="panel-b">
        <div class="tabs">
          <button class="${pDir==='pago'?'on':''}" onclick="abrirPago('pago',1)">Pago a proveedor</button>
          <button class="${pDir==='cobro'?'on':''}" onclick="abrirPago('cobro',1)">Cobranza de cliente</button>
        </div>
        <div class="f">
          <div class="full"><label>${pDir==='pago'?'Proveedor':'Cliente'}</label>

              optEnt(e => pDir==='pago' ? e.es_proveedor : e.es_cliente) || optEnt()}</select></div>

        <div style="margin-top:14px"><b style="font-size:13px">Facturas a cancelar</b>
          <div id="np-facturas" class="mini" style="margin-top:6px">Elegí una entidad…</div></div>
        <div style="margin-top:14px"><b style="font-size:13px">Con qué se paga</b>
          <div id="np-medios" style="margin-top:6px"></div>
          <div class="row-act" style="margin-top:8px">
            <button class="g xs" onclick="addMedio('efectivo')">+ Efectivo</button>
            <button class="g xs" onclick="addMedio('transferencia')">+ Transferencia</button>
            <button class="g xs" onclick="addMedio('cheque')">+ Cheque</button>
          </div></div>
        <div style="margin-top:16px"><button onclick="guardarPago()">Guardar comprobante</button></div>
      </div>
    </div>
    ${ps.length ? `<div class="panel"><div class="panel-h"><b>${ps.length} comprobante(s)</b></div>
      ${tabla(['Fecha','Tipo','Entidad','Nº','Medios','Aplica a','Retenciones','Total'],
        ps.map(p => [fecha(p.fecha),
          p.direccion === 'cobro' ? '<span class="badge b-ok">cobranza</span>' : '<span class="badge b-warn">pago</span>',
          esc(p.entidad), esc(p.numero||'—'),
          `<span class="mini">${p.medios.map(m => esc(m.medio)).join(', ')}</span>`,
          `<span class="mini">${p.aplicaciones.map(a => `${esc(a.tipo)} ${esc(a.numero||a.factura_id)}`).join(', ') || '—'}</span>`,
          `<button class="g xs" onclick="verRetenciones(${p.id}, '${esc(p.numero||('recibo '+p.id))}')">${
            p.retenido ? plata(p.retenido) : 'cargar'}</button>`,
          {n:plata(p.total)}]))}
    </div>` : '<div class="panel"><div class="vacio">Sin pagos ni cobranzas.</div></div>'}`);
}
/* Abrir ya elige la dirección: antes había que abrir el panel y DESPUÉS
   acordarse de tildar la pestaña, y quedaban cobranzas cargadas como pagos. */
function abrirPago(dir, yaAbierto){
  pDir = dir;
  if (!yaAbierto) $('#p-alta').classList.remove('hide');
  const tit = $('#p-titulo');
  if (tit) tit.textContent = dir === 'pago' ? 'Nuevo pago a proveedor' : 'Nueva cobranza de cliente';
  const lbl = $('#np-ent')?.previousElementSibling;
  if (lbl) lbl.textContent = dir === 'pago' ? 'Proveedor' : 'Cliente';
  prepararPago();
}
function prepararPago(){ pMedios = []; pintarMedios(); cargarImpagas();
  const s = $('#np-ent'); if (s) s.innerHTML = optEnt(e => pDir==='pago' ? e.es_proveedor : e.es_cliente) || optEnt();
  document.querySelectorAll('#p-alta .tabs button').forEach((b,i) =>
    b.classList.toggle('on', (i===0) === (pDir==='pago')));
}
async function cargarImpagas(){
  const cont = $('#np-facturas'); if (!cont) return;
  const eid = +val('np-ent'); if (!eid) return cont.textContent = 'Elegí una entidad…';
  const mov = pDir === 'pago' ? 'compra' : 'venta';
  const fs = (await api(`/api/c/facturas?mov=${mov}&impagas=1`)).filter(f => f.entidad_id === eid);
  pFacturas = fs;
  cont.innerHTML = fs.length ? fs.map((f,i) => `
    <label class="chk">
      <input type="checkbox" id="pf-${i}" onchange="sumarSel()">
      ${esc(f.tipo)} ${esc(f.punto_venta||'')}-${esc(f.numero||'')} · ${fecha(f.fecha)} ·
      saldo <b>${plata(f.saldo)}</b></label>`).join('')
    : '<span class="mini">No tiene facturas impagas.</span>';
}
function sumarSel(){
  const t = pFacturas.reduce((s,f,i) => s + ($('#pf-'+i)?.checked ? f.saldo : 0), 0);
  if (pMedios.length === 1) { const inp = $('#pm-imp-0'); if (inp && !inp.value) inp.value = t.toFixed(2); }
}
function addMedio(medio){ pMedios.push({medio}); pintarMedios(); }
function quitarMedio(i){ pMedios.splice(i,1); pintarMedios(); }
function pintarMedios(){
  const c = $('#np-medios'); if (!c) return;
  c.innerHTML = pMedios.map((m,i) => `
    <div class="cand" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <b>${m.medio}</b><button class="g xs" onclick="quitarMedio(${i})">Quitar</button></div>
      <div class="f">
        <div><label>Importe</label><input id="pm-imp-${i}" type="number" step="0.01"></div>
        ${m.medio === 'transferencia' ? `<div class="full"><label>Movimiento del banco</label>
          <select id="pm-mov-${i}"><option value="">Cargando…</option></select></div>` : ''}
        ${m.medio === 'cheque' ? (pDir === 'pago' ? `
          <div class="full"><label>Cheque de cartera a endosar (o dejar vacío y emitir uno nuevo)</label>
            <select id="pm-chq-${i}" onchange="toggleChqNuevo(${i})"><option value="">— emitir uno nuevo —</option></select></div>
          <div class="full chq-nuevo-${i}"><div class="f">
            <div><label>Número</label><input id="pm-num-${i}"></div>
            <div><label>Banco</label><input id="pm-banco-${i}"></div>
            <div><label>Fecha de pago</label><input type="date" id="pm-fp-${i}" value="${hoy()}"></div>
          </div></div>` : `
          <div class="full"><div class="f">
            <div><label>Número</label><input id="pm-num-${i}"></div>
            <div><label>Banco</label><input id="pm-banco-${i}"></div>
            <div><label>Fecha de pago</label><input type="date" id="pm-fp-${i}" value="${hoy()}"></div>
            <div><label>CUIT librador</label><input id="pm-lib-${i}" placeholder="opcional"></div>
          </div></div>`) : ''}
      </div>
    </div>`).join('') || '<span class="mini">Agregá al menos un medio.</span>';
  pMedios.forEach((m,i) => {
    if (m.medio === 'transferencia') api('/api/c/movimientos?pendientes=1').then(ms => {
      const s = $('#pm-mov-'+i); if (!s) return;
      s.innerHTML = '<option value="">— elegir —</option>' + ms.map(x =>
        `<option value="${x.id}">${fecha(x.fecha)} · ${esc(x.banco)} · ${plata(x.importe)} · ${esc((x.descripcion||'').slice(0,32))}</option>`).join('');
    });
    if (m.medio === 'cheque' && pDir === 'pago') api('/api/c/cheques?estado=en_cartera').then(cs => {
      const s = $('#pm-chq-'+i); if (!s) return;
      s.innerHTML = '<option value="">— emitir uno nuevo —</option>' + cs.map(x =>
        `<option value="${x.id}">${esc(x.numero)} · ${esc(x.banco||'')} · ${plata(x.importe)} · vence ${fecha(x.fecha_pago)}</option>`).join('');
    });
  });
}
function toggleChqNuevo(i){
  const usa = val('pm-chq-'+i) !== '';
  document.querySelectorAll('.chq-nuevo-'+i).forEach(e => e.classList.toggle('hide', usa));
}
async function guardarPago(){
  try{
    const aplicaciones = pFacturas.map((f,i) => $('#pf-'+i)?.checked ? {factura_id:f.id, importe:f.saldo} : null)
      .filter(Boolean);
    const medios = pMedios.map((m,i) => {
      const base = {medio:m.medio, importe:num('pm-imp-'+i)};
      if (m.medio === 'transferencia') base.movimiento_id = +val('pm-mov-'+i) || null;
      if (m.medio === 'cheque'){
        const enCartera = pDir === 'pago' ? val('pm-chq-'+i) : '';
        if (enCartera) base.cheque_id = +enCartera;
        else base.cheque = {numero: val('pm-num-'+i), banco: val('pm-banco-'+i),
          fecha_pago: val('pm-fp-'+i), cuit_librador: val('pm-lib-'+i)};
      }
      return base;
    });
    await post('/api/c/pagos', {direccion:pDir, entidad_id:+val('np-ent'), fecha:val('np-fecha'),
      numero:val('np-num'), aplicaciones, medios});
    toast('Comprobante guardado — el banco quedó actualizado'); pMedios = []; vPagos();
  }catch(e){ toast(e.message, true); }
}

/* ══ PERCEPCIONES Y RETENCIONES ══
   El catálogo se pide una vez y queda: es público y no cambia. */
let TRIB = [];
async function catTributos(){
  if (!TRIB.length) TRIB = await api('/api/tributos').catch(() => []);
  return TRIB;
}
const nombreTrib = c => (TRIB.find(t => t.codigo === c) || {}).nombre || c;

/* ── El desglose de una factura ──
   `percepciones` es el TOTAL que trae el comprobante (la columna «Otros
   Tributos» de ARCA). Acá se dice DE QUÉ es cada peso, porque de eso depende
   contra qué DJ se computa: la percepción de IVA es crédito en la de IVA, la
   de IIBB en la de IIBB. Lo que queda sin clasificar no computa en ninguna. */
let TF = [];
async function verTributos(fid, etiqueta){
  await catTributos();
  const d = await api(`/api/c/facturas/${fid}/tributos`);
  TF = d.tributos.map(t => ({...t}));
  if (!TF.length && d.total_comprobante)
    TF = [{tipo:'sin_clasificar', monto:d.total_comprobante}];
  abrirTributos(fid, etiqueta, d);
}
function abrirTributos(fid, etiqueta, d){
  const viejo = $('#modal-trib'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-trib';
  el.innerHTML = `<div class="box" style="max-width:720px">
    <h3>Tributos de ${esc(etiqueta)}</h3>
    <div class="mini" style="margin-bottom:10px">El comprobante dice
      <b>${plata(d.total_comprobante)}</b> en otros tributos. Decí de qué es cada peso:
      la percepción de <b>IVA</b> es crédito en la DJ de IVA, la de <b>IIBB</b> en la de IIBB.
      Lo que quede sin clasificar no se computa en ninguna.</div>
    <div id="tf-lista"></div>
    <div class="row-act" style="margin-top:10px">
      <button class="g xs" onclick="tfAgregar()">+ Tributo</button>
      <span class="mini" id="tf-suma" style="margin-left:8px"></span></div>
    <div class="row-act" style="justify-content:flex-end;margin-top:16px">
      <button class="g" onclick="$('#modal-trib').remove()">Cancelar</button>
      <button onclick="tfGuardar(${fid})">Guardar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  tfPintar(d.total_comprobante);
}
function tfPintar(declarado){
  const c = $('#tf-lista'); if (!c) return;
  c.innerHTML = TF.map((t,i) => `
    <div class="cand" style="display:block">
      <div class="f">
        <div class="full"><label>Concepto</label>
          <select onchange="TF[${i}].tipo=this.value;tfPintar(${declarado})">
            ${TRIB.map(x => `<option value="${x.codigo}"${x.codigo===t.tipo?' selected':''}>${esc(x.nombre)}</option>`).join('')}
          </select></div>
        <div><label>Monto</label><input type="number" step="0.01" value="${t.monto ?? ''}"
          oninput="TF[${i}].monto=parseFloat(this.value)||0;tfSuma(${declarado})"></div>
        <div><label>Jurisdicción</label><input value="${esc(t.jurisdiccion||'')}"
          oninput="TF[${i}].jurisdiccion=this.value" placeholder="Formosa"></div>
        <div style="display:flex;align-items:flex-end">
          <button class="g xs" onclick="TF.splice(${i},1);tfPintar(${declarado})">Quitar</button></div>
      </div></div>`).join('') || '<div class="vacio">Sin tributos.</div>';
  tfSuma(declarado);
}
function tfSuma(declarado){
  const s = TF.reduce((a,t) => a + (parseFloat(t.monto)||0), 0);
  const d = Math.round((declarado - s) * 100) / 100;
  const el = $('#tf-suma'); if (!el) return;
  el.innerHTML = `desglosado ${plata(s)} de ${plata(declarado)}`
    + (Math.abs(d) < 0.01 ? ' · <b class="pos">cierra</b>'
       : ` · <b class="neg">falta ${plata(d)}</b>`);
}
function tfAgregar(){ TF.push({tipo:'percepcion_iva', monto:0}); tfPintar(0); }
async function tfGuardar(fid){
  try{
    await post(`/api/c/facturas/${fid}/tributos`,
      {tributos: TF.filter(t => (parseFloat(t.monto)||0) !== 0)});
    $('#modal-trib')?.remove();
    toast('Tributos guardados — la posición de IVA se recalcula');
    vFacturas();
  }catch(e){ toast(e.message, true); }
}

/* ── Las retenciones de un recibo ──
   La ecuación que faltaba: medios de pago + retenciones = imputado a las
   facturas. Sin la segunda pata, una factura cobrada con retención queda
   impaga por la diferencia para siempre. */
let TR = [];
async function verRetenciones(pid, etiqueta){
  await catTributos();
  const d = await api(`/api/c/pagos/${pid}/retenciones`);
  TR = d.retenciones.map(r => ({...r}));
  const viejo = $('#modal-ret'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-ret';
  el.innerHTML = `<div class="box" style="max-width:760px">
    <h3>Retenciones de ${esc(etiqueta)}</h3>
    <div class="mini" id="tr-eco" style="margin-bottom:10px"></div>
    <div id="tr-lista"></div>
    <div class="row-act" style="margin-top:10px">
      <button class="g xs" onclick="trAgregar()">+ Retención</button></div>
    <div class="row-act" style="justify-content:flex-end;margin-top:16px">
      <button class="g" onclick="$('#modal-ret').remove()">Cancelar</button>
      <button onclick="trGuardar(${pid})">Guardar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  trPintar(d);
}
function trPintar(d){
  const c = $('#tr-lista'); if (!c) return;
  const soloRet = TRIB.filter(t => t.clase === 'retencion');
  c.innerHTML = TR.map((r,i) => `
    <div class="cand" style="display:block">
      <div class="f">
        <div><label>Concepto</label>
          <select onchange="TR[${i}].tipo=this.value">
            ${soloRet.map(x => `<option value="${x.codigo}"${x.codigo===r.tipo?' selected':''}>${esc(x.nombre)}</option>`).join('')}
          </select></div>
        <div><label>Régimen</label><input value="${esc(r.codigo_regimen||'')}"
          placeholder="094" oninput="TR[${i}].codigo_regimen=this.value"></div>
        <div><label>Base (importe sujeto)</label><input type="number" step="0.01"
          value="${r.base ?? ''}" oninput="TR[${i}].base=parseFloat(this.value)||null"></div>
        <div><label>Monto retenido</label><input type="number" step="0.01" value="${r.monto ?? ''}"
          oninput="TR[${i}].monto=parseFloat(this.value)||0;trEco(${d.medios_de_pago},${d.imputado_a_facturas})"></div>
        <div><label>Nº certificado</label><input value="${esc(r.certificado||'')}"
          oninput="TR[${i}].certificado=this.value" placeholder="sin esto no se computa"></div>
        <div style="display:flex;align-items:flex-end">
          <button class="g xs" onclick="TR.splice(${i},1);trPintar(${JSON.stringify(d).replace(/"/g,'&quot;')})">Quitar</button></div>
      </div></div>`).join('') || '<div class="vacio">Sin retenciones.</div>';
  trEco(d.medios_de_pago, d.imputado_a_facturas);
}
function trEco(medios, aplicado){
  const s = TR.reduce((a,r) => a + (parseFloat(r.monto)||0), 0);
  const dif = Math.round((aplicado - (medios + s)) * 100) / 100;
  const el = $('#tr-eco'); if (!el) return;
  el.innerHTML = `Medios de pago <b>${plata(medios)}</b> + retenciones <b>${plata(s)}</b>
    = <b>${plata(medios + s)}</b> · imputado a facturas <b>${plata(aplicado)}</b>`
    + (!aplicado ? ' <span class="mini">(a cuenta: no hay nada imputado)</span>'
       : Math.abs(dif) < 0.01 ? ' · <b class="pos">cierra</b>'
       : ` · <b class="neg">faltan ${plata(dif)}</b>`)
    + '<br><span class="mini">Sin el número de certificado la retención no se puede computar en la DJ.</span>';
}
function trAgregar(){ TR.push({tipo:'retencion_iva', monto:0}); trPintar({medios_de_pago:0, imputado_a_facturas:0}); }
async function trGuardar(pid){
  try{
    await post(`/api/c/pagos/${pid}/retenciones`,
      {retenciones: TR.filter(r => (parseFloat(r.monto)||0) > 0)});
    $('#modal-ret')?.remove();
    toast('Retenciones guardadas'); vPagos();
  }catch(e){ toast(e.message, true); }
}

async function conciliarManual(mid, tipo, id){

}

    const rol = val('ne-rol');
    await post('/api/c/entidades', {cuit: val('ne-cuit'), razon_social: val('ne-rs'),
      alias_interno: val('ne-alias'), es_proveedor: rol !== 'cli', es_cliente: rol !== 'prov'});
    toast('Entidad agregada'); await precargar(); vEntidades();
  }catch(e){ toast(e.message, true); }
}

/* ══ EL PANEL ══
   Cómo está el equipo, qué servicios corren y qué se puede correr.
   Lección del panel del ERP: sin registro de las corridas no se puede
   contestar "¿esto se corrió?" ni "¿por qué falló?" — por eso el historial
   vive en la base y no se pierde al apagar. */
const RUBROS_JOB = {impuestos:'Impuestos — ARCA y las provincias', bancos:'Bancos — extractos y cheques'};
async function vPanel(){
  cargando('Panel');
  const [p, js] = await Promise.all([api('/api/panel'), api('/api/jobs')]);
  if (js.error) return pintar(`<h2>Panel</h2><div class="vacio">${esc(js.error)}</div>`);
  const d = p.datos;
  pintar(`
    <h2>Panel</h2>
    <div class="sub">El estado del equipo y todo lo que se puede correr.
      Los jobs marcados <b>atendido</b> abren una ventana y esperan que entres vos (2FA o captcha).</div>

    <div class="panel"><div class="panel-h"><b>Servicios</b>
      <span class="mini">${esc(p.equipo.maquina)} · ${esc(p.equipo.usuario)}</span></div>
      ${tabla(['Servicio','Puerto','Estado','Nota'],
        p.servicios.map(s => [
          `<b>${esc(s.nombre)}</b>${s.propio ? '' : ' <span class="badge b-mut">otro sistema</span>'}`,
          s.puerto,
          s.vivo ? '<span class="badge b-ok">prendido</span>'
                 : '<span class="badge b-mut">apagado</span>',
          `<span class="mini">${esc(s.nota)}</span>`]))}
    </div>

    <div class="grid">
      <div class="card"><div class="k">Clientes</div><div class="v">${d.clientes}</div></div>
      <div class="card"><div class="k">Facturas</div><div class="v">${d.facturas}</div></div>
      <div class="card"><div class="k">Movimientos</div><div class="v">${d.movimientos}</div>
        <div class="mini ${d.sin_conciliar ? 'neg' : ''}">${d.sin_conciliar} sin conciliar</div></div>
      <div class="card"><div class="k">Cheques</div><div class="v">${d.cheques}</div></div>
      <div class="card"><div class="k">Entidades en el maestro</div><div class="v">${d.entidades}</div></div>
      <div class="card"><div class="k">Base</div><div class="v sm">${p.base.mb} MB</div>
        <div class="mini">${esc(p.base.ruta)}</div></div>
    </div>

    <div class="panel" style="margin-top:16px${p.respaldo.avisar ? ';border-left:3px solid var(--bad)' : ''}">
      <div class="panel-h"><b>Respaldo de la base</b>
        <button class="${p.respaldo.avisar ? '' : 'g'} xs" onclick="respaldar(this)">Respaldar ahora</button></div>
      <div class="panel-b">
        <div class="${p.respaldo.avisar ? 'neg' : 'pos'}"><b>${esc(p.respaldo.mensaje)}</b></div>
        <div class="mini" style="margin-top:5px">
          ${p.respaldo.hay ? `${p.respaldo.copias} copia(s) guardadas · última de ${p.respaldo.mb} MB<br>` : ''}
          Carpeta: <code>${esc(p.respaldo.carpeta || (p.drive.ruta + '\respaldo'))}</code>
          ${p.drive.montado ? '' : ' <span class="badge b-bad">el Drive no está montado</span>'}
        </div>
        <div class="mini" style="margin-top:7px">Se respalda solo al arrancar el sistema.
          La base <b>no</b> vive en el Drive —un SQLite adentro de una carpeta que sincroniza
          se corrompe—: solo suben las copias.</div>
      </div>
    </div>

    ${p.faltan.length ? `<div class="panel" style="margin-top:16px;border-left:3px solid var(--warn)">
      <div class="panel-h"><b>Falta cargar — sin esto los jobs no pueden entrar solos</b></div>
      ${tabla(['Qué falta','Fuente','Cliente','Cómo se carga'],
        p.faltan.map(f => [esc(f.que), esc(f.fuente || '—'), esc(f.alias || '—'),
          f.que === 'credencial'
            ? `<code class="mini">py parsers/credenciales.py --set --fuente ${esc(f.fuente)} --alias ${esc(f.alias)}</code>`
            : '<span class="mini">se pone en C:\SIBRA\estudio\</span>']))}
    </div>` : ''}

    ${Object.entries(RUBROS_JOB).map(([r, titulo]) => {
      const del = js.filter(j => j.rubro === r);
      if (!del.length) return '';
      return `<div class="panel"><div class="panel-h"><b>${titulo}</b></div>
        <div class="panel-b">${del.map(j => tarjetaJob(j)).join('')}</div></div>`;
    }).join('')}

    <div class="panel"><div class="panel-h"><b>Últimas corridas</b>
      <button class="g xs" onclick="vPanel()">Actualizar</button></div>
      <div id="jb-corridas"><div class="vacio">—</div></div>
    </div>`);
  verCorridas();
}
function tarjetaJob(j){
  const u = j.ultima_corrida;
  const faltan = j.clientes.filter(c => c.credencial === false).map(c => c.alias);
  return `<div class="cand" style="display:block;margin-bottom:9px">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:230px">
        <b>${esc(j.titulo)}</b>
        ${j.atendido ? '<span class="badge b-warn" style="margin-left:6px">atendido</span>' : ''}
        ${j.existe ? '' : '<span class="badge b-bad" style="margin-left:6px">falta el archivo</span>'}
        <span class="badge b-mut" style="margin-left:6px">${esc(j.origen)}</span>
        <div class="mini" style="margin-top:3px">${esc(j.desc)}</div>
        ${faltan.length ? `<div class="mini neg">sin credencial: ${faltan.map(esc).join(', ')}</div>` : ''}
        ${u ? `<div class="mini">última corrida ${esc(u.inicio.replace('T',' '))} ·
          ${u.estado === 'corriendo' ? '<span class="amb">corriendo…</span>'
            : u.estado === 'ok' ? '<span class="pos">terminó bien</span>' : '<span class="neg">falló</span>'}
          ${u.estado !== 'corriendo' ? `· <a href="#" onclick="verSalida('${u.id}');return false">ver salida</a>` : ''}
        </div>` : ''}
      </div>
      <div class="row-act" style="align-items:center">
        ${j.args.includes('--alias') ? `<select id="jb-alias-${j.clave}" style="width:auto;min-width:130px">
          ${j.clientes.map(c => `<option value="${esc(c.alias)}"${CLI && c.alias===CLI.alias?' selected':''}>${esc(c.alias)}</option>`).join('')}
        </select>` : ''}
        ${j.args.includes('--periodo') ? `<input id="jb-per-${j.clave}" value="${periodoHoy()}"
          style="width:100px" placeholder="MM/AAAA">` : ''}
        <button class="xs" ${j.existe?'':'disabled'} onclick="correrJob('${j.clave}', ${JSON.stringify(j.args).replace(/"/g,'&quot;')})">Correr</button>
      </div>
    </div>
  </div>`;
}
async function correrJob(clave, argsDef){
  const args = {};
  if (argsDef.includes('--alias')) args['--alias'] = $('#jb-alias-'+clave)?.value;
  if (argsDef.includes('--periodo')) args['--periodo'] = $('#jb-per-'+clave)?.value;
  try{
    const r = await post(`/api/jobs/${clave}/correr`, {args});
    toast('Job lanzado — si es atendido, mirá la ventana que se abre');
    seguir(r.id);
  }catch(e){ toast(e.message, true); }
}
async function seguir(cid){
  for (let i = 0; i < 600; i++){
    await new Promise(r => setTimeout(r, 2000));
    let c; try{ c = await api('/api/jobs/corrida/' + cid); }catch(e){ return; }
    if (!c || c.estado === 'corriendo') { if (location.hash === '#panel') verCorridas(); continue; }
    toast(c.estado === 'ok' ? 'El job terminó bien' : 'El job falló — mirá la salida', c.estado !== 'ok');
    if (location.hash === '#panel') { vPanel(); verSalida(cid); }
    return;
  }
}
async function verCorridas(){
  const c = $('#jb-corridas'); if (!c) return;
  const cs = await api('/api/jobs/corridas').catch(() => []);
  c.innerHTML = cs.length ? tabla(['Arrancó','Job','Sobre','Duró','Quién','Estado',''],
    cs.map(x => [esc((x.inicio||'').replace('T',' ')), esc(x.job),
      `<span class="mini">${esc(x.alias || '—')}</span>`,
      x.segundos == null ? '—' : (x.segundos < 60 ? x.segundos + 's'
        : Math.round(x.segundos/60) + ' min'),
      `<span class="mini">${esc(x.usuario || '—')}</span>`,
      x.estado === 'corriendo' ? '<span class="badge b-warn">corriendo</span>'
        : x.estado === 'ok' ? '<span class="badge b-ok">ok</span>' : '<span class="badge b-bad">falló</span>',
      `<button class="g xs" onclick="verSalida(${x.id})">Salida</button>`]))
    : '<div class="vacio">Todavía no se corrió ningún job.</div>';
}
async function verSalida(cid){
  const c = await api('/api/jobs/corrida/' + cid);
  const cont = $('#jb-corridas'); if (!cont) return;
  cont.insertAdjacentHTML('afterbegin', `
    <div class="panel-b" style="border-bottom:1px solid var(--bor2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <b>${esc(c.job)} · ${esc(c.inicio.replace('T',' '))}</b>
        <button class="g xs" onclick="this.closest('div.panel-b').remove()">Cerrar</button></div>
      <pre style="background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:11px;
        overflow:auto;max-height:340px;font-size:12px;white-space:pre-wrap">${esc(c.salida || '(sin salida)')}</pre>
    </div>`);
}

async function respaldar(btn){
  btn.disabled = true; btn.textContent = 'Respaldando…';
  try{
    const r = await post('/api/respaldo', {});
    toast(r.ok ? `Copia hecha (${r.mb} MB) — ${r.detalle}` : r.error, !r.ok);
  }catch(e){ toast(e.message, true); }
  vPanel();
}

/* ══ CLIENTES DEL ESTUDIO ══ */
async function vClientes(){
  const cs = await api('/api/clientes');
  CLIENTES = cs;
  pintar(`
    <h2>Clientes del estudio</h2>
    <div class="sub">Cada CUIT es un cliente y está aislado del resto. El de arriba es el que se está
      viendo ahora en todos los módulos.</div>
    <div class="panel"><div class="panel-h"><b>Alta de cliente</b>
      <button class="g xs" onclick="toggle('#c-alta')">Mostrar</button></div>
      <div class="panel-b hide" id="c-alta"><div class="f">
        <div><label>CUIT</label><input id="nc-cuit" placeholder="30-12345678-9"></div>
        <div><label>Alias</label><input id="nc-alias" placeholder="nombre corto"></div>
        <div class="full"><label>Razón social</label><input id="nc-rs"></div>
        <div><label>Condición IVA</label>
          <select id="nc-iva"><option value="RI">Resp. Inscripto</option>
            <option value="monotributo">Monotributo</option><option value="exento">Exento</option></select></div>
        <div style="display:flex;align-items:flex-end"><button onclick="altaCliente()">Crear cliente</button></div>
      </div></div>
      ${cs.length ? tabla(['Alias','Razón social','CUIT','Jurisdicciones','Alta',''],
        cs.map(c => [`<b>${esc(c.alias)}</b>`, esc(c.razon_social), esc(c.cuit),
          esc(c.jurisdicciones||'—'), fecha(c.alta),
          CLI && c.alias === CLI.alias ? '<span class="badge b-ok">viendo ahora</span>'
            : `<button class="g xs" onclick="cambiarEmpresa('${esc(c.alias)}')">Ver esta</button>`]))
        : '<div class="vacio">Sin clientes. Cargá el primero.</div>'}
    </div>`);
}
async function altaCliente(){
  try{
    await post('/api/clientes', {cuit: val('nc-cuit'), alias: val('nc-alias'),
      razon_social: val('nc-rs'), condicion_iva: val('nc-iva')});
    toast('Cliente creado');
    CLIENTES = await api('/api/clientes');
    $('#sel-empresa').innerHTML = CLIENTES.map(c =>
      `<option value="${esc(c.alias)}">${esc(c.razon_social)}</option>`).join('');
    if (!CLI) return arrancar();
    $('#sel-empresa').value = CLI.alias;
    vClientes();
  }catch(e){ toast(e.message, true); }
}

/* ── arranque ── */
document.documentElement.className = localStorage.getItem('ee-tema') || '';
arrancar();
</script>
