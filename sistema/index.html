<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERBEN ESTUDIO</title>
<style>
/* ══ IDENTIDAD ERBEN ESTUDIO ══
   Del manual de marca: azul #2E5F85 · gris #A7AD83 · carbón #2B2F34 ·
   hueso #F5F5F2 · dorado #D0A64B. Tipografía Century Gothic.

   El DORADO es el acento: en el logo es el único color cálido y el que
   remata la marca, así que acá manda los botones y lo seleccionado. El AZUL
   queda de institucional (encabezados, foco), y el carbón de fondo.
   Usar el azul de acento competiría con el fondo y apagaría la marca. */
:root{
  --marca-azul:#2E5F85; --marca-oro:#D0A64B; --marca-gris:#A7AD83;
  --marca-carbon:#2B2F34; --marca-hueso:#F5F5F2;

  --bg:#1B1E22; --bg2:#22262B; --bg3:#2B2F34; --hover:#363B42;
  --bor:#3A4048; --bor2:#2B2F34;
  --txt:#F5F5F2; --txt2:#C6C9C4; --mut:#8A9098;
  --ac:#D0A64B; --ac2:#E0BC70; --warn:#D0A64B; --bad:#C4614C;
}
html.light{
  --bg:#F5F5F2; --bg2:#FFFFFF; --bg3:#EDEDE8; --hover:#E2E2DC;
  --bor:#D2D2CB; --bor2:#E8E8E2;
  --txt:#2B2F34; --txt2:#4A5058; --mut:#79808A;
  --ac:#A97F2C; --ac2:#8C6820;   /* el oro se oscurece en claro: sobre blanco no se lee */
}
*{margin:0;padding:0;box-sizing:border-box}
/* Century Gothic es la del manual y está en Windows. Las de respaldo son
   geométricas del mismo aire, para que no cambie el carácter si falta. */
body{background:var(--bg);color:var(--txt);
  font:14px/1.55 'Century Gothic','URW Gothic','Questrial','Futura','Trebuchet MS',sans-serif}
h2,.logo-txt b,.card .v{letter-spacing:.01em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}

.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:34px;height:34px;flex-shrink:0}
.logo-txt{line-height:1}
.logo-txt b{font-size:15px;font-weight:700;letter-spacing:.06em}
.logo-txt span{display:block;font-size:8px;letter-spacing:.34em;color:var(--marca-oro);
  margin-top:4px;text-transform:uppercase}

/* ── la fila de arriba: el filtro de empresa manda sobre todo ── */
header{background:var(--bg2);border-bottom:1px solid var(--bor2);padding:10px 16px;position:sticky;top:0;z-index:50}
.hd{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.filtro-empresa{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--ac);
  border-radius:9px;padding:5px 8px 5px 13px;flex:1;max-width:560px;min-width:260px}
.filtro-empresa .et{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}
.filtro-empresa select{background:transparent;border:0;font-size:14.5px;font-weight:700;padding:4px 2px;
  flex:1;min-width:0;cursor:pointer}
.filtro-empresa select:focus{outline:0}
.cuit-chip{font-size:11px;color:var(--mut);white-space:nowrap;flex-shrink:0}
nav{background:var(--bg2);border-bottom:1px solid var(--bor2);padding:0 16px;overflow-x:auto}
.nav{max-width:1500px;margin:0 auto;display:flex;gap:2px}
.nav a{padding:11px 13px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--txt)}
.nav a.on{color:var(--ac2);border-bottom-color:var(--ac)}
main{max-width:1500px;margin:0 auto;padding:22px 16px 60px}
h2{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.card{background:var(--bg2);border:1px solid var(--bor);border-radius:10px;padding:15px}
.card .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.card .v{font-size:22px;font-weight:700;margin-top:6px}
.card .v.sm{font-size:16px}
.panel{background:var(--bg2);border:1px solid var(--bor);border-radius:10px;margin-bottom:16px;overflow:hidden}
.panel-h{padding:12px 15px;border-bottom:1px solid var(--bor2);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h b{font-size:14px}
.panel-b{padding:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:11px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.05em;border-bottom:1px solid var(--bor);white-space:nowrap}
th[data-col]{cursor:pointer;user-select:none;position:relative;padding-right:20px}
th[data-col]:hover{color:var(--txt)}
th[data-col]::after{content:'⇅';position:absolute;right:7px;opacity:.28;font-size:10px}
th[data-col][data-orden="asc"]::after{content:'↑';opacity:1;color:var(--ac)}
th[data-col][data-orden="desc"]::after{content:'↓';opacity:1;color:var(--ac)}
td{padding:9px 12px;border-bottom:1px solid var(--bor2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
tr.click{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla-wrap{overflow-x:auto}
button{background:var(--marca-oro);color:#2B2F34;border:0;border-radius:6px;padding:8px 14px;
  font-size:13px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.02em}
button:hover{background:#E0BC70}
button.g{background:var(--bg3);color:var(--txt2);border:1px solid var(--bor)}
button.g:hover{background:var(--hover);color:var(--txt)}
button.xs{padding:4px 9px;font-size:11.5px;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.f{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.f .full{grid-column:1/-1}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:rgba(46,95,133,.22);color:#7FB2DA}
.b-warn{background:rgba(208,166,75,.18);color:var(--marca-oro)}
.b-bad{background:rgba(196,97,76,.18);color:#E28873}
.b-mut{background:var(--bg3);color:var(--mut)}
.vacio{padding:32px 16px;text-align:center;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--bor);overflow-x:auto}
.tabs button{background:none;color:var(--mut);border:0;border-bottom:2px solid transparent;
  border-radius:0;padding:8px 14px;font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ac2);border-bottom-color:var(--ac)}
.pos{color:#7FB2DA} .neg{color:#E28873} .amb{color:var(--marca-oro)}
.mini{font-size:11.5px;color:var(--mut)}
.aviso{background:var(--bg2);border:1px solid var(--bor);border-left:3px solid var(--ac);
  border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--txt2);margin-bottom:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);
  border:1px solid var(--ac);border-radius:8px;padding:11px 18px;font-size:13px;z-index:200;display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.hide{display:none!important}
/* Depositar y endosar pedían los datos con prompt(): había que acordarse del
   número de la cuenta o de la entidad y escribirlo bien. Es el mismo error que
   el ERP ya corrigió — se elige de una lista, no se transcribe. */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--bg2);border:1px solid var(--bor);border-radius:10px;
  max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal .box h3{margin:0 0 4px;font-size:15px}
.row-act{display:flex;gap:5px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;
  color:var(--txt);margin:4px 0;cursor:pointer}
.chk input{width:auto;flex:none}
.cand{background:var(--bg3);border:1px solid var(--bor);border-radius:7px;padding:8px 11px;margin-top:6px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px}
.cadena{font-size:11.5px;color:var(--mut);margin-top:3px}
.cadena i{font-style:normal;color:var(--ac2)}
#arranque{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
</style>
</head>
<body>

<header><div class="hd">
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 100 100" aria-label="ERBEN ESTUDIO">
        <g>
          <path d="M50 6 L50 22 L14 48 L4 41 Z" fill="#2E5F85"/>
          <path d="M50 6 L50 22 L86 48 L96 41 Z" fill="#A7AD83"/>
          <path d="M50 32 L50 48 L14 74 L4 67 Z" fill="#2E5F85"/>
          <path d="M50 32 L50 48 L86 74 L96 67 Z" fill="#A7AD83"/>
          <path d="M50 58 L50 74 L14 100 L4 93 Z" fill="#2E5F85"/>
          <path d="M50 58 L50 74 L86 100 L96 93 Z" fill="#A7AD83"/>
          <path d="M4 93 L14 100 L4 100 Z" fill="#D0A64B"/>
        </g>
      </svg>
    <div class="logo-txt"><b>ERBEN ESTUDIO</b><span>Forjando legado</span></div>
  </div>
  <!-- EL FILTRO: se elige una empresa y TODOS los módulos filtran por ella.
       No hay ALL: el sistema trabaja con una sola empresa por vez. -->
  <div class="filtro-empresa">
    <span class="et">Empresa</span>
    <select id="sel-empresa" onchange="cambiarEmpresa(this.value)"></select>
    <span class="cuit-chip" id="cuit-chip"></span>
  </div>
  <button class="g xs" onclick="tema()">◐ Tema</button>
</div></header>

<div id="cartel-licencia"></div>
<nav><div class="nav" id="nav"></div></nav>
<main id="vista"><div id="arranque">Cargando…</div></main>
<div id="toast"></div>

<script>
let CLI = null, CLIENTES = [], ACT = [], ENT = [], CTAS = [], LICENCIA = null;

const MODULOS = [
  ['tesoreria',    'Tesorería'],
  ['facturas',     'Facturas'],
  ['bancos',       'Bancos'],
  ['cheques',      'Cheques'],
  ['pagos',        'Pagos'],
  // Conciliación NO es un módulo suelto: vive DENTRO de Tesorería, como en el
  // Conciliar es cruzar plata: por eso vive dentro de Tesorería, no aparte.
  ['impuestos',    'Impuestos'],
  ['iibb',         'DJ IIBB'],
  ['entidades',    'Entidades'],
  ['panel',        'Panel'],
  ['clientes',     'Clientes del estudio'],
];

/* ── utilidades ── */
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plata = n => (n == null ? '—' : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('es-AR',
  {minimumFractionDigits:2, maximumFractionDigits:2}));
const fecha = f => !f ? '—' : f.slice(0,10).split('-').reverse().join('/');
const hoy = () => new Date().toISOString().slice(0,10);
const periodoHoy = () => { const d = new Date(); return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
function toggle(sel){ $(sel).classList.toggle('hide'); }
/* Un formulario chico encima de la pantalla. Devuelve una promesa: resuelve con
   los valores de los campos, o con null si se cancela. */
function modal(titulo, ayuda, campos, textoOk = 'Aceptar'){
  return new Promise(res => {
    const d = document.createElement('div');
    d.className = 'modal';
    d.innerHTML = `<div class="box"><h3>${esc(titulo)}</h3>
      <div class="mini" style="margin-bottom:12px">${ayuda}</div>
      <div class="f">${campos.map(c => `<div class="${c.ancho || 'full'}">
        <label>${esc(c.label)}</label>${c.html}</div>`).join('')}</div>
      <div class="row-act" style="justify-content:flex-end;margin-top:16px">
        <button class="g" id="md-no">Cancelar</button>
        <button id="md-si">${esc(textoOk)}</button></div></div>`;
    document.body.appendChild(d);
    const cerrar = v => { d.remove(); res(v); };
    d.querySelector('#md-no').onclick = () => cerrar(null);
    d.onclick = e => { if (e.target === d) cerrar(null); };
    d.querySelector('#md-si').onclick = () =>
      cerrar(Object.fromEntries(campos.map(c => [c.id, val(c.id)])));
    setTimeout(() => d.querySelector('input,select')?.focus(), 30);
  });
}
function tema(){ document.documentElement.classList.toggle('light');
  localStorage.setItem('ee-tema', document.documentElement.className); }
function toast(msg, malo){
  const t = $('#toast'); t.textContent = msg;
  t.style.borderColor = malo ? 'var(--bad)' : 'var(--ac)';
  t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', 3800);
}
// Toda respuesta que llega TARDE se abandona. Sin esto, cambiar de empresa (o
// de módulo) mientras algo está cargando deja que la respuesta vieja pinte
// encima de la nueva: se vio la pantalla de Impuestos con el módulo en Cheques
// En un sistema donde cada empresa es un compartimiento estanco,
// una pintada tardía es lo más parecido a un dato filtrado — así que la
// promesa se abandona en silencio y ese render nunca termina.
// ── DÓNDE ESTÁ LA API ──
// La pantalla puede venir de dos lados: servida por el equipo local (mismo
// origen, ruta relativa) o publicada en la nube. En el segundo caso la API
// SIGUE SIENDO LA LOCAL: los datos del cliente nunca pasan por internet —
// el navegador habla directo con la máquina del estudio.
const API = (function(){
  const guardado = localStorage.getItem('ee-api');
  if (guardado !== null) return guardado;
  const local = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  return local ? '' : 'http://localhost:8310';
})();

const marca = () => (location.hash || '') + '|' + (CLI ? CLI.alias : '');
async function api(ruta, opts){
  const sep = ruta.includes('?') ? '&' : '?';
  const url = API + ruta + (CLI && ruta.startsWith('/api/c/') ? sep + 'cliente=' + encodeURIComponent(CLI.alias) : '');
  const antes = marca();
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({error:'respuesta ilegible del servidor'}));
  // Se abandona la respuesta tardía SOLO si es una lectura: una escritura ya
  // pasó y su resultado hay que verlo aunque el usuario haya cambiado de
  // pantalla. Antes decía `!== 'POST'` y un DELETE se descartaba en silencio.
  const escribe = opts && opts.method && opts.method !== 'GET';
  if (marca() !== antes && !escribe) return new Promise(() => {});
  if (!r.ok) throw new Error(j.error || ('error ' + r.status));
  return j;
}
const post = (ruta, cuerpo) => api(ruta, {method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify(cuerpo)});
const val = id => ($('#'+id)?.value ?? '').trim();
const num = id => { const v = val(id); return v === '' ? null : parseFloat(v.replace(',','.')); };
function tabla(cols, filas, opts){
  return `<div class="tabla-wrap"><table><thead><tr>${
    cols.map(c => `<th data-col${/importe|monto|total|base|saldo|debo|debe|aplicado/i.test(c) ? ' class="num"' : ''}>${c}</th>`).join('')
  // `fila(i)` deja marcar una fila entera — hoy lo usan los duplicados de
  // cheques, que se ven de un vistazo y no leyendo columna por columna.
  }</tr></thead><tbody>${filas.map((f,i) => `<tr${opts?.onclick ? ` class="click" onclick="${opts.onclick(i)}"` : ''}${opts?.fila ? opts.fila(i) : ''}>${
    f.map(c => typeof c === 'object' && c?.n !== undefined ? `<td class="num">${c.n}</td>` : `<td>${c}</td>`).join('')
  }</tr>`).join('')}</tbody></table></div>`;
}
/* ══ ORDENAR CUALQUIER TABLA POR SU ENCABEZADO ══
   Traído de `ERP/shared/tabla-orden.js` (pedido de Juan, 21/08). Acá no hay
   filas de detalle, así que esa parte no se porta; sí las otras dos trampas,
   que son las que rompen un ordenador ingenuo:

   1. LOS NÚMEROS ARGENTINOS: «$ 1.234,56» como texto pone 1.000 antes que 999.
      El punto agrupa y la coma decide los centavos, al revés que en inglés.
   2. LAS FECHAS dd/mm/aaaa: como texto, 02/01/2026 va antes que 15/12/2025.

   Y una tercera propia: las celdas traen HTML (pastillas, botones), así que se
   compara por el TEXTO visible, no por el markup. */
function valorCelda(td){
  if (!td) return null;
  const crudo = (td.getAttribute('data-orden') ?? td.textContent ?? '').trim();
  if (!crudo || crudo === '—' || crudo === '-') return null;   // vacíos al final

  const dmy = crudo.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (dmy) return Number(dmy[3] + dmy[2].padStart(2,'0') + dmy[1].padStart(2,'0'));
  const iso = crudo.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return Number(iso[1] + iso[2] + iso[3]);

  const limpio = crudo.replace(/[$\s ]/g,'');
  if (/^-?[\d.]+(,\d+)?$/.test(limpio)){
    const n = Number(limpio.replace(/\./g,'').replace(',','.'));
    if (!isNaN(n)) return n;
  }
  if (/^-?\d+(\.\d+)?$/.test(limpio)) return Number(limpio);
  return crudo.toLocaleLowerCase('es-AR');
}
function compararCeldas(a, b){
  // los vacíos SIEMPRE al final: una fila sin fecha arriba de todo no sirve
  if (a === null && b === null) return 0;
  if (a === null) return 1;
  if (b === null) return -1;
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b), 'es-AR', {numeric:true});
}
function ordenarTabla(th){
  const tabla = th.closest('table'), cuerpo = tabla.tBodies[0];
  if (!cuerpo) return;
  const i = [...th.parentNode.children].indexOf(th);
  const desc = th.getAttribute('data-orden') === 'asc';
  th.parentNode.querySelectorAll('th[data-col]').forEach(x => x.removeAttribute('data-orden'));
  th.setAttribute('data-orden', desc ? 'desc' : 'asc');

  // el índice original desempata: filas iguales no se barajan solas
  const filas = [...cuerpo.rows].map((tr, n) => ({tr, clave: valorCelda(tr.cells[i]), n}));
  filas.sort((x, y) => {
    const c = compararCeldas(x.clave, y.clave);
    return c !== 0 ? (desc ? -c : c) : x.n - y.n;
  });
  const frag = document.createDocumentFragment();
  filas.forEach(f => frag.appendChild(f.tr));
  cuerpo.appendChild(frag);
}
// Un solo listener en el documento: sobrevive a que cualquier vista se repinte.
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (th) ordenarTabla(th);
});

function badgeEstado(e){
  const cls = {pendiente:'b-warn', presentado:'b-ok', pagado:'b-ok', en_cartera:'b-ok', emitido:'b-warn',
    depositado:'b-mut', endosado:'b-mut', debitado:'b-mut', cobrado:'b-mut', rechazado:'b-bad',
    anulado:'b-bad', borrador:'b-warn', presentada:'b-ok', saldada:'b-ok', saldado:'b-ok',
    impaga:'b-warn', conciliado:'b-ok', 'sin registrar':'b-warn', 'sin aplicar':'b-warn',
    parcial:'b-warn', imputado:'b-ok', 'a cuenta':'b-warn', 'le debés':'b-bad', 'te debe':'b-warn',
    cruzado:'b-warn'}[e] || 'b-mut';
  return `<span class="badge ${cls}">${esc((e||'').replace(/_/g,' '))}</span>`;
}
function colorFecha(f){
  if (!f) return '';
  const h = hoy(), m = new Date(Date.now()+86400000).toISOString().slice(0,10);
  return f < h ? 'neg' : (f <= m ? 'amb' : '');
}

/* ── el filtro de empresa: manda sobre todos los módulos ── */
/* ── LA LICENCIA ──
   Si venció, el sistema queda en SOLO LECTURA: ve todo, imprime y exporta,
   pero no carga ni corre jobs. Lo que no puede pasar es que alguien apriete
   Guardar, no pase nada y no sepa por qué — por eso el cartel va arriba de
   todo y dice qué se puede y qué no. */
async function verLicencia(){
  let l;
  try{ l = await api('/api/licencia'); }catch(e){ return; }
  LICENCIA = l;
  const c = $('#cartel-licencia');
  if (!c || l.estado === 'sin_control' || l.estado === 'al_dia'){
    if (c) c.innerHTML = ''; return;
  }
  const grave = !l.puede_escribir;
  c.innerHTML = `<div style="padding:10px 18px;border-bottom:1px solid var(--bor);
    background:${grave ? 'rgba(220,60,60,.10)' : 'rgba(220,160,40,.10)'}">
    <b>${esc(l.titulo)}</b> ${esc(l.detalle)}
    ${l.estudio ? `<span class="mini"> · ${esc(l.estudio)}${
      l.vence ? ' · vencía el ' + fecha(l.vence) : ''}</span>` : ''}
  </div>`;
}

async function arrancar(){
  // ⚠ Se espera: si la lectura queda en vuelo mientras arranca el cliente, el
  // guardacarreras de api() la descarta y el cartel no aparece nunca — que es
  // justo la pantalla en la que hay que explicar por qué no se puede guardar.
  await verLicencia();
  try{ CLIENTES = await api('/api/clientes'); }
  catch(e){ return sinEquipoLocal(e); }
  if (!CLIENTES.length){
    $('#sel-empresa').innerHTML = '<option>— sin clientes —</option>';
    $('#nav').innerHTML = MODULOS.filter(m => m[0]==='clientes')
      .map(([k,t]) => `<a href="#${k}" id="nav-${k}" class="on">${t}</a>`).join('');
    return vClientes();
  }
  $('#sel-empresa').innerHTML = CLIENTES.map(c =>
    `<option value="${esc(c.alias)}">${esc(c.razon_social)}</option>`).join('');
  $('#nav').innerHTML = MODULOS.map(([k,t]) => `<a href="#${k}" id="nav-${k}">${t}</a>`).join('');
  const guardado = localStorage.getItem('ee-empresa');
  const inicial = CLIENTES.find(c => c.alias === guardado) || CLIENTES[0];
  await cambiarEmpresa(inicial.alias, true);
}

   estudio está apagado. Decirlo con todas las letras — un "error de red" hace
   que la gente crea que se perdieron los datos. */

      <div class="panel-b">
        ${enLaNube ? `

          <ol style="margin:0 0 12px 20px;color:var(--txt2)">
            <li>Andá a la computadora del estudio</li>

function cambiarApi(){
  const v = prompt('¿En qué dirección está el equipo del estudio?\n\n' +
    'Dejalo vacío si la pantalla la sirve el mismo equipo.', API);
  if (v === null) return;
  localStorage.setItem('ee-api', v.trim().replace(/\/$/, ''));
  location.reload();
}

async function cambiarEmpresa(alias, primera){
  CLI = CLIENTES.find(c => c.alias === alias);
  if (!CLI) return;
  localStorage.setItem('ee-empresa', alias);
  $('#sel-empresa').value = alias;
  $('#cuit-chip').textContent = CLI.cuit + (CLI.jurisdicciones ? ' · ' + CLI.jurisdicciones : '');
  await precargar();
  // Cambiar la empresa REFILTRA el módulo en el que estás — no te saca de él.
  if (primera && !location.hash) location.hash = '#tesoreria';
  else router();
  if (!primera) toast('Filtrando por ' + CLI.razon_social);
}
async function precargar(){
  [ACT, ENT, CTAS] = await Promise.all([
    api('/api/c/actividades').catch(()=>[]),
    api('/api/c/entidades').catch(()=>[]),
    api('/api/c/cuentas').catch(()=>[]),
  ]);
}
/* ══ BUSCAR UNA ENTIDAD POR NOMBRE, CUIT O ALIAS ══
   Traído de `ERP/shared/entidades.js`. Juan (31/08): «Chipi es Fabián Alcaraz
   pero es más fácil escribir chipi. El sistema genera con nombre y CUIT, pero
   buscarlos que sea por ambos».

   ⚠ El alias sirve para BUSCAR, no para decidir identidad: si un alias apunta
   a dos entidades, se ofrecen las dos y elige la persona. Elegir solo sería
   imputarle una factura al que no es. */
function normEnt(s){
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function coincideEntidad(e, q){
  const n = normEnt(q);
  if (!n) return true;
  return normEnt(e.razon_social).includes(n)
      || normEnt(e.cuit).includes(n)
      || normEnt(e.alias_interno).includes(n);
}
function etiquetaEntidad(e){
  const ali = e.alias_interno && normEnt(e.alias_interno) !== normEnt(e.razon_social)
    ? ` · (${e.alias_interno})` : '';
  return `${e.razon_social}${e.cuit ? ' · ' + e.cuit : ''}${ali}`;
}

const optEnt = (f = () => true, q = '') => ENT.filter(f).filter(e => coincideEntidad(e, q))
  .map(e => `<option value="${e.id}">${esc(etiquetaEntidad(e))}</option>`).join('');
const optCta = () => CTAS.map(c =>

  const f = {tesoreria:vTesoreria, facturas:vFacturas, bancos:vBancos, cheques:vCheques, pagos:vPagos,

    panel:vPanel, clientes:vClientes}[v] || vTesoreria;

  f();
}

    toast('Conciliado — y quedó el recibo'); vTesoreria(); }catch(e){ toast(e.message, true); }

async function imputar(pid){
  try{ const r = await post(`/api/c/pagos/${pid}/imputar`, {});
    toast(r.imputado.length ? `Imputado a ${r.imputado.length} factura(s)`
      : 'No hay facturas impagas de esa entidad', !r.imputado.length);
    vTesoreria();

/* Un impuesto liquidado por el sistema entra al calendario recién cuando
   alguien le pone la fecha. Es a propósito: la fecha de vencimiento depende de
   la terminación del CUIT y la trae el calendario de ARCA — calcularla sería
   escribir un dato que nadie leyó. */
async function cargarDeterminado(impuesto, periodo, importe){
  const r = await modal(`Cargar ${impuesto} ${periodo} al calendario`,
    `Se va a crear la obligación por <b>${plata(importe)}</b>, tal como la liquidó el sistema.
     <br><br>La fecha es la del vencimiento real: depende de la terminación del CUIT.`,
    [{id:'md-fec', label:'Fecha de vencimiento', html:`<input id="md-fec" type="date" value="${hoy()}">`}],

    toast('Cargado — ya está en el calendario y en la posición'); tImp();
  }catch(e){ toast(e.message, true); }
}

/* ══ TABLERO · DOCUMENTOS ══ — el del ERP, separado por clase.
   Sin la sección de documentos de obra: acá el circuito arranca en la factura.

   Las secciones van EN EL ORDEN DE LA ESCALERA, y el título de cada una dice
   con qué se aplica. Eso es lo que convierte una lista larga en algo que se
   lee: no es «todo junto ordenado por fecha», es «esto se salda con aquello». */
let docFlujo = '', docEnt = '', docSoloFalta = false;

const SECCIONES_DOC = [
  {tit: 'FACTURAS / NC / ND', con: 'se aplican con PAGO',
   filtro: x => x.clase === 'factura'},
  {tit: 'PAGOS / RECIBOS', con: 'se aplican con efectivo, banco y cheques',
   filtro: x => x.clase === 'pago'},
  {tit: 'CHEQUES', con: 'se aplican con RECIBOS',
   filtro: x => x.clase === 'cheque'},
  {tit: 'BANCO', con: 'se aplica con RECIBOS — transferencias, depósitos, pago de cheques',
   filtro: x => x.clase === 'banco'},
  {tit: 'IMPUESTOS', con: 'se aplican con el VEP y el débito del banco',
   filtro: x => x.clase === 'impuesto'},
];

/* Qué falta, y NO es lo mismo según el documento. A una factura de compra le
   falta el pago, a la de venta el cobro.
   ⚠ Y una NOTA DE CRÉDITO no «falta pagar»: es plata que se DEJA de deber.
   Decirle «falta pagar» invierte el signo del hecho. */
function faltaDe(x){
  if (x.clase !== 'factura') return 'sin aplicar a facturas';
  if (['NC','ND'].includes(x.tipo)) return 'sin aplicar';
  return x.mov === 'compra' ? 'falta pagar' : 'falta cobrar';
}

/* Los HUECOS arriba y los DOCUMENTOS abajo, en la misma pantalla.
   Son la misma pregunta mirada de cerca y de lejos: «qué falta» y «qué hay».
   Separarlas obligaba a saltar de pestaña para resolver una fila. */
async function tTableroDocs(){
  await tTablero();
  const antes = $('#t-panel').innerHTML;
  await tDoc();
  $('#t-panel').innerHTML = antes
    + '<div style="height:8px"></div>' + $('#t-panel').innerHTML;
}

async function tDoc(){
  const ds = await api('/api/c/tesoreria/documentos');
  const q = normEnt(docEnt);
  const vis = ds.filter(d =>
    (!docFlujo || d.flujo === docFlujo)
    && (!q || normEnt(d.entidad || '').includes(q) || normEnt(d.detalle || '').includes(q))
    && (!docSoloFalta || (d.saldo != null ? Math.abs(d.saldo) > 0.01 : d.estado === 'sin registrar')));
  panelT(`
    <div class="aviso"><b>La escalera:</b> FACTURA se aplica con PAGO · PAGO con efectivo, banco
      o cheques · CHEQUE y BANCO con RECIBOS · IMPUESTO con su VEP y el débito.
      Cada sección dice con qué se salda, y <b>la columna «Falta»</b> dice qué le falta a esa
      fila puntual — que no es lo mismo para una compra que para una venta.
      <br><b>Hacé clic en cualquier fila</b> y sale la cadena entera, de ida y de vuelta.</div>

    <div class="panel"><div class="panel-b"><div class="f">
      <div><label>Entidad (escribí para filtrar)</label>
        <input id="doc-ent" value="${esc(docEnt)}" placeholder="todas"
          oninput="docEnt=this.value;clearTimeout(window._td);window._td=setTimeout(tDoc,350)"></div>
      <div><label>Ingresos / egresos</label>
        <select onchange="docFlujo=this.value;tDoc()">
          <option value=""${!docFlujo?' selected':''}>Todos</option>
          <option value="ingreso"${docFlujo==='ingreso'?' selected':''}>Ingresos</option>
          <option value="egreso"${docFlujo==='egreso'?' selected':''}>Egresos</option></select></div>
      <div style="display:flex;align-items:flex-end">
        <label class="chk"><input type="checkbox" ${docSoloFalta?'checked':''}
          onchange="docSoloFalta=this.checked;tDoc()"> Solo lo que falta</label></div>
      <div style="display:flex;align-items:flex-end" class="mini">
        ${vis.length} de ${ds.length} documento(s)</div>
    </div></div></div>

    ${SECCIONES_DOC.map(s => {
      const fs = vis.filter(s.filtro);
      if (!fs.length) return '';
      const falta = fs.reduce((a,d) => a + (d.saldo != null ? Math.abs(d.saldo) : 0), 0);
      return `<div class="panel"><div class="panel-h">
        <b>${esc(s.tit)}</b>
        <span class="mini">${esc(s.con)} · ${fs.length} doc(s)${
          falta > 0.01 ? ` · <b class="neg">${plata(falta)} sin aplicar</b>` : ''}</span></div>
      ${tabla(['Fecha','Documento','Entidad / detalle','Neto','IVA','Total','A aplicar','Estado','Cadena'],
        fs.map(d => [fecha(d.fecha),
          `<b>${esc(d.detalle)}</b>`,
          esc(d.entidad || '—'),
          {n: d.neto == null ? '—' : plata(d.neto)},
          {n: d.iva == null ? '—' : plata(d.iva)},
          {n:`<span class="${d.flujo==='egreso'?'neg':'pos'}">${plata(d.total)}</span>`},
          {n: d.saldo == null || Math.abs(d.saldo) < 0.01
             ? '<span class="mini">—</span>'
             : `<span class="neg">${plata(d.saldo)}</span><div class="mini">${esc(faltaDe(d))}</div>`},
          badgeEstado(d.estado),
          d.cadena.length ? `<span class="mini">${d.cadena.map(c => esc(c)).join(' · ')}</span>`
            : `<span class="mini">se aplica con ${esc(d.se_aplica_con)}</span>`]),
        {onclick: i => `verCadena('${fs[i].clase}',${fs[i].id})`,
         fila: i => fs[i].anulado ? ' style="opacity:.45"' : ''})}
      </div>`;
    }).join('') || '<div class="panel"><div class="vacio">Sin documentos con ese filtro.</div></div>'}`);
}

/* ── LA CADENA ENTERA, DE IDA Y DE VUELTA ──
   Los vínculos ya existían todos; lo que faltaba era recorrerlos hasta el
   final. La grilla mostraba UN eslabón —la factura decía "cobro REC-1" y ahí
   terminaba— y para saber en qué banco entró esa plata había que ir a buscarlo
   a mano. Se hace clic en cualquier fila y sale el árbol completo. */
async function verCadena(clase, id){
  let d;
  try{ d = await api(`/api/c/documento/${clase}/${id}/cadena`); }
  catch(e){ return toast(e.message, true); }
  const viejo = $('#modal-cad'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-cad';
  el.innerHTML = `<div class="box" style="max-width:780px">
    <h3>La cadena completa</h3>
    <div class="mini" style="margin-bottom:12px">${d.eslabones} eslabón(es) ·
      ${d.completa ? '<b class="pos">todo explicado</b>'
        : `<b class="neg">${d.huecos.length} hueco(s)</b>`}</div>
    ${ramaCadena(d.arbol, 0)}
    ${d.huecos.length ? `<div class="aviso" style="margin-top:14px;border-left-color:var(--bad)">
      <b>Lo que falta para que la cadena cierre:</b>
      ${d.huecos.map(h => `<div class="mini">· ${esc(h)}</div>`).join('')}</div>` : ''}
    <div class="row-act" style="justify-content:flex-end;margin-top:16px">
      <button onclick="$('#modal-cad').remove()">Cerrar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
}
const ICONO = {factura:'📄', pago:'🧾', cheque:'🏷', banco:'🏦', impuesto:'🏛',
               vep:'🎫', retencion:'✂', efectivo:'💵', deposito:'⬇', endoso:'➡'};
function ramaCadena(n, nivel){
  const sangria = nivel * 22;
  return `<div style="margin-left:${sangria}px;border-left:${nivel ? '2px solid var(--bor)' : '0'};
      padding-left:${nivel ? 10 : 0}px;margin-top:6px">
    <div class="cand" style="display:block;margin-top:0">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
        <span><b>${ICONO[n.clase] || '•'} ${esc(n.titulo)}</b>
          ${n.rol ? `<span class="mini"> — ${esc(n.rol)}</span>` : ''}
          ${n.detalle ? `<div class="mini">${esc(n.detalle)}</div>` : ''}</span>
        <span style="white-space:nowrap">
          ${n.importe != null ? `<b class="${n.importe < 0 ? 'neg' : ''}">${plata(n.importe)}</b>` : ''}
          ${n.aplica != null ? `<span class="mini"> aplica ${plata(n.aplica)}</span>` : ''}
          ${n.fecha ? `<div class="mini">${fecha(n.fecha)}</div>` : ''}</span>
      </div>
      ${n.estado ? `<div style="margin-top:4px">${badgeEstado(n.estado)}</div>` : ''}
      ${n.falta ? `<div class="mini neg" style="margin-top:4px">falta ${esc(n.falta)}</div>` : ''}
    </div>
    ${n.hijos.map(h => ramaCadena(h, nivel + 1)).join('')}
  </div>`;
}

/* ══ FACTURAS ══

   período y la POSICIÓN encadenada. Sin la pestaña de obra, que acá no existe.

   La liquidación de IVA vive acá y no en Impuestos: sale de las facturas y es
   la posición de IVA (Juan, 02/09). En Impuestos quedan los vencimientos. */
let fMov = 'venta', fTab = 'venta', fPer = null;

async function vFacturas(){
  cargando('Facturas');
  const tabs = [['venta','Ventas'],['compra','Compras'],['act','Actividades · IIBB'],
                ['iva','IVA del período'],['pos','Posición de IVA'],
                ['ban','Del banco · IVA e IIBB']];
  pintar(`<h2>Facturas</h2>

      Y de las facturas sale la posición de IVA.</div>
    <div class="tabs">${tabs.map(([k,t]) =>
      `<button class="${fTab===k?'on':''}" onclick="fTab='${k}';vFacturas()">${t}</button>`).join('')}</div>

/* ── ACTIVIDADES · IIBB ──
   La pestaña del módulo del ERP, y acá no es una comodidad: es la diferencia
   entre una DJ bien y una mal. Con el primer cliente las 56 ventas quedaron
   todas en la actividad principal al 3%, y el portal reparte esa misma base
   en TRES actividades —una al 15%—. Son $133.884 en un solo mes.

   Se agrupa POR CLIENTE porque es lo que hace el trabajo posible: 15 de esas
   56 ventas son a la misma Municipalidad y explican $78 de los $91 millones.
   Se decide una vez y se aplican las quince. De a una, nadie las clasifica. */
let acPeriodo = '', acSoloSin = true, acSel = new Set();

async function fActividades(){
  const q = (acPeriodo ? '?periodo=' + encodeURIComponent(acPeriodo) : '')
          + (acSoloSin ? (acPeriodo ? '&' : '?') + 'solo_sin=1' : '');
  const d = await api('/api/c/facturas/sin-actividad' + q);
  const opciones = ACT.map((a,i) =>
    `<option value="${i}">${esc(a.codigo)} · ${esc((a.nombre||'').slice(0,44))} — ${a.alicuota}%${
      a.principal ? ' (principal)' : ''}</option>`).join('');
  panelF(`
    <div class="aviso">Una venta mal clasificada <b>no se ve</b>: la DJ cierra igual y el
      impuesto sale mal. Una actividad al 15% contada al 3% se paga de menos y después se
      reclama.<br>Se agrupa por cliente porque es como se decide: <b>un cliente suele facturar
      siempre lo mismo</b>, así que se resuelve de una vez para todas sus ventas.</div>

    <div class="panel"><div class="panel-b"><div class="f">
      <div><label>Período</label><input type="month" id="ac-per" value="${esc(acPeriodo)}"
        onchange="acPeriodo=this.value;acSel.clear();fActividades()"></div>
      <div style="display:flex;align-items:flex-end">
        <label class="chk"><input type="checkbox" ${acSoloSin?'checked':''}
          onchange="acSoloSin=this.checked;acSel.clear();fActividades()">
          Solo las que faltan clasificar</label></div>
      <div style="display:flex;align-items:flex-end" class="mini">
        ${d.total} venta(s) · <b class="${d.sin_actividad?'neg':'pos'}">${d.sin_actividad} sin actividad</b>
        · ${plata(d.neto_total)} de neto</div>
    </div></div></div>

    ${ACT.length ? `<div class="panel"><div class="panel-h"><b>Asignar a las tildadas</b>
      <span class="mini" id="ac-cuenta">${acSel.size} tildada(s)</span></div>
      <div class="panel-b"><div class="f">
        <div class="full"><label>Actividad + alícuota</label>
          <select id="ac-masiva"><option value="">— quitar la actividad —</option>${opciones}</select></div>
        <div style="display:flex;align-items:flex-end"><button onclick="asignarMasiva()">Aplicar</button></div>
      </div></div></div>`
      : `<div class="aviso" style="border-left-color:var(--bad)"><b>No hay padrón de actividades
         cargado.</b> Lo trae el job de ATP: sin eso no hay de dónde elegir.</div>`}

    ${d.grupos.length ? d.grupos.map(g => `
      <div class="panel"><div class="panel-h">
        <b>${esc(g.entidad)}</b>
        <span class="mini">${g.facturas.length} venta(s) · ${plata(g.neto)} de neto
          <button class="g xs" style="margin-left:8px"
            onclick="tildarGrupo(${JSON.stringify(g.facturas.map(f=>f.id)).replace(/"/g,'&quot;')})">
            Tildar todas</button></span></div>
      ${tabla(['','Fecha','Comprobante','Neto','Total','Actividad'],
        g.facturas.map(f => [
          `<input type="checkbox" style="width:auto" ${acSel.has(f.id)?'checked':''}
             onchange="tildar(${f.id})">`,
          fecha(f.fecha),
          `${esc(f.tipo)} ${esc(f.letra||'')} ${esc(f.punto_venta||'')}-${esc(f.numero||'')}`,
          {n:plata(f.neto)}, {n:plata(f.total)},
          f.iibb_codigo
            ? `${esc(f.iibb_codigo)} · ${f.iibb_alicuota}%`
            : '<span class="neg">sin actividad</span>']))}
      </div>`).join('')
      : '<div class="panel"><div class="vacio">Nada para clasificar con ese filtro.</div></div>'}`);
}

function tildar(id){
  acSel.has(id) ? acSel.delete(id) : acSel.add(id);
  const c = $('#ac-cuenta'); if (c) c.textContent = acSel.size + ' tildada(s)';
}

function tildarGrupo(ids){
  const todas = ids.every(i => acSel.has(i));
  ids.forEach(i => todas ? acSel.delete(i) : acSel.add(i));
  fActividades();
}

async function asignarMasiva(){
  if (!acSel.size) return toast('No tildaste ninguna', true);
  const i = val('ac-masiva');
  const a = i === '' ? null : ACT[+i];
  const r = await modal(a ? 'Asignar la actividad' : 'Quitar la actividad',
    a ? `Se les va a poner <b>${esc(a.codigo)} — ${esc(a.nombre||'')}</b> al <b>${a.alicuota}%</b>
         a las <b>${acSel.size}</b> ventas tildadas.<br><br>
         La alícuota es la que define cuánto se paga: revisá que sea la que corresponde a lo
         que esas ventas facturan.`
      : `Se les va a <b>quitar</b> la actividad a las ${acSel.size} ventas tildadas.<br><br>
         Mientras estén sin actividad la DJ no cierra.`,
    [], a ? 'Asignar' : 'Quitar');
  if (!r) return;
  try{
    const res = await post('/api/c/facturas/actividad-masiva',
      {facturas: [...acSel], codigo: a ? a.codigo : null, alicuota: a ? a.alicuota : null});

/* ── EL GRÁFICO: acumulado a favor (línea) + posición del mes (barras) ──
   Traído del módulo Facturas del ERP, con la paleta de ERBEN.

   ⚠ EL SALDO A FAVOR NO ES UNA BUENA NOTICIA (Juan, 31/08: «cuando la línea
   anda por posición a favor que esté roja»). La línea nunca es negativa: es
   plata que YA se pagó de más y queda parada en ARCA hasta que un débito la
   consuma. Pintarla como algo bueno la lee como "vamos bien"; es capital
   inmovilizado. Por eso el tramo va en rojo en cuanto alguna de sus dos puntas
   tiene saldo, y en azul solo cuando cierra en cero.

   ⚠ Las dos escalas son distintas A PROPÓSITO: el acumulado es mucho más
   grande que el mes suelto y con una sola escala las barras no se verían. El
   aire de arriba (34px, no 18) es para el título de cada eje: sin eso los dos
   topes quedan pegados y se leen como si fueran el mismo número — pasó en el
   ERP y costó un rato entender que los dos estaban bien. */
function graficoIVA(serie){
  if (!serie.length) return '<div class="vacio">Sin meses para graficar.</div>';
  const datos = [...serie].reverse();               // del más viejo al más nuevo
  const W = Math.max(680, datos.length * 54), H = 316;
  const M = {arriba:34, abajo:46, izq:84, der:84};
  const ancho = W - M.izq - M.der, alto = H - M.arriba - M.abajo;

  const maxAcum = Math.max(...datos.map(f => f.saldo_favor_final), 1);
  const topePos = Math.max(...datos.map(f => Math.abs(f.posicion)), 1);
  const x = i => M.izq + (datos.length === 1 ? ancho/2 : (i*ancho)/(datos.length-1));
  const yAcum = v => M.arriba + alto - (v/maxAcum)*alto;
  const cero = M.arriba + alto/2;                   // el 0 de las barras, al medio
  const yPos = v => cero - (v/topePos)*(alto/2);

  const ROJO = '#E28873', AZUL = '#7FB2DA', LINEA = 'var(--bor)', MUT = 'var(--mut)';
  const enFavor = v => (v||0) > 0.01;

  const ab = Math.min(26, ancho/Math.max(datos.length,1)*0.5);
  const barras = datos.map((f,i) => {
    const y = yPos(f.posicion), h = Math.abs(y - cero);
    return `<rect x="${x(i)-ab/2}" y="${Math.min(y,cero)}" width="${ab}"
        height="${Math.max(h,1)}" fill="${f.posicion>0?ROJO:AZUL}" opacity=".75"
      ><title>${f.periodo}\nPosición del mes: ${plata(f.posicion)}${
        f.a_pagar ? '\nA pagar: '+plata(f.a_pagar) : ''}</title></rect>`;
  }).join('');

  const linea = datos.slice(1).map((f,k) => {
    const i = k+1, a = datos[i-1];
    const color = (enFavor(a.saldo_favor_final) || enFavor(f.saldo_favor_final)) ? ROJO : AZUL;
    return `<path d="M${x(i-1)},${yAcum(a.saldo_favor_final)} L${x(i)},${yAcum(f.saldo_favor_final)}"
      fill="none" stroke="${color}" stroke-width="2.5"/>`;
  }).join('');
  const puntos = datos.map((f,i) => `<circle cx="${x(i)}" cy="${yAcum(f.saldo_favor_final)}" r="3.5"
      fill="${enFavor(f.saldo_favor_final)?ROJO:AZUL}"
    ><title>${f.periodo}\nSaldo a favor acumulado: ${plata(f.saldo_favor_final)}${
      enFavor(f.saldo_favor_final) ? '\n(plata inmovilizada en ARCA)' : ''}</title></circle>`).join('');

  // Una etiqueta cada N para que no se pisen cuando son 20 meses.
  const cada = Math.ceil(datos.length/14);
  const etiq = datos.map((f,i) => i % cada ? '' : `<text x="${x(i)}" y="${H-26}"
      text-anchor="middle" font-size="9" fill="${MUT}"
      transform="rotate(-40 ${x(i)} ${H-26})">${f.periodo}</text>`).join('');

  const ult = datos[datos.length-1], colUlt = enFavor(ult.saldo_favor_final) ? ROJO : AZUL;
  return `<div style="overflow-x:auto">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">
      <line x1="${M.izq}" y1="${cero}" x2="${W-M.der}" y2="${cero}" stroke="${LINEA}"/>
      <line x1="${M.izq}" y1="${M.arriba}" x2="${M.izq}" y2="${M.arriba+alto}" stroke="${LINEA}"/>
      <line x1="${W-M.der}" y1="${M.arriba}" x2="${W-M.der}" y2="${M.arriba+alto}" stroke="${LINEA}"/>
      ${barras}${linea}${puntos}${etiq}
      <!-- Anclado a la IZQUIERDA y no al eje: con text-anchor="end" el rótulo
           se salía del viewBox y quedaba cortado ("CUMULADO" en vez de
           "ACUMULADO"). -->
      <text x="2" y="${M.arriba-12}" font-size="9"
        font-weight="600" fill="${enFavor(maxAcum)?ROJO:AZUL}">A FAVOR ACUMULADO (línea)</text>
      <text x="${W-M.der+6}" y="${M.arriba-12}" font-size="9" font-weight="600"
        fill="${MUT}">MES (barras)</text>
      <line x1="${M.izq-4}" y1="${M.arriba}" x2="${M.izq}" y2="${M.arriba}" stroke="${enFavor(maxAcum)?ROJO:AZUL}"/>
      <text x="${M.izq-6}" y="${M.arriba+3}" text-anchor="end" font-size="9"
        fill="${enFavor(maxAcum)?ROJO:AZUL}">${plata(maxAcum)}</text>
      <text x="${M.izq-6}" y="${M.arriba+alto+3}" text-anchor="end" font-size="9" fill="${MUT}">0</text>
      <line x1="${W-M.der}" y1="${yPos(topePos)}" x2="${W-M.der+4}" y2="${yPos(topePos)}" stroke="${ROJO}"/>
      <text x="${W-M.der+6}" y="${yPos(topePos)+3}" font-size="9" fill="${ROJO}">${plata(topePos)}</text>
      <line x1="${W-M.der}" y1="${yPos(-topePos)}" x2="${W-M.der+4}" y2="${yPos(-topePos)}" stroke="${AZUL}"/>
      <text x="${W-M.der+6}" y="${yPos(-topePos)+3}" font-size="9" fill="${AZUL}">${plata(-topePos)}</text>
      <text x="${W-M.der+6}" y="${cero+3}" font-size="9" fill="${MUT}">0</text>
      <text x="${W-M.der-8}" y="${yAcum(ult.saldo_favor_final)-8}" text-anchor="end"
        font-size="11" font-weight="700" fill="${colUlt}">${plata(ult.saldo_favor_final)}</text>
    </svg>
    <div class="mini" style="margin-top:6px">
      <b style="color:${ROJO}">— línea</b>: saldo a favor acumulado (eje izquierdo) ·
      <b>barras</b>: posición de cada mes (eje derecho) — <span style="color:${ROJO}">roja</span> se paga,
      <span style="color:${AZUL}">azul</span> queda a favor. Pasá el mouse para ver los números.
      <br>Las dos escalas son distintas a propósito: el acumulado es mucho más grande que el mes
      suelto y con una sola escala las barras no se verían.
      <br><b>La línea en rojo no es buena noticia:</b> es plata ya pagada que quedó parada en ARCA.
    </div></div>`;
}

/* El saldo a favor con el que el cliente llegó al estudio no está en ningún
   comprobante: sale de la última DJ que presentó antes. Si no se declara, el
   arrastre arranca en cero y le hace perder un crédito que tenía. */
async function declararInicial(){
  const r = await modal('El saldo a favor que venía de antes',
    'Sale de la última DJ de IVA presentada antes de que el estudio tomara al cliente. '
    + 'Sin esto, el arrastre arranca en cero.', [
    {id:'md-per', label:'Primer período que liquida el estudio (MM/AAAA)',
     html:'<input id="md-per" placeholder="01/2026">', ancho:''},
    {id:'md-fav', label:'Saldo a favor que traía', html:'<input id="md-fav" type="number" step="0.01" value="0">'},
    {id:'md-nota', label:'De dónde sale (opcional)', html:'<input id="md-nota" placeholder="DJ 12/2025">'}
  ], 'Guardar');
  if (!r) return;
  try{ await post('/api/c/iva/inicial', {periodo:r['md-per'], a_favor:parseFloat(r['md-fav'])||0,
        nota:r['md-nota']});
    toast('Guardado — la cadena se recalcula'); fPosicion();
  }catch(e){ toast(e.message, true); }
}

/* ── DEL BANCO: el crédito que no viene en ninguna factura ──
   La percepción de IVA y la de IIBB no siempre llegan adentro de un
   comprobante: el banco las debita de la cuenta y el único papel es el
   resumen. Son crédito igual, y en IIBB pesan: el SIRCREB recauda sobre TODO
   lo que se acredita, mes a mes.

   Por qué hay dos listas y no una sola cuenta hecha: antes esto se restaba
   mirando el texto del extracto («dice perc y dice iva, entonces resto»). Eso
   falla por las dos puntas — el banco que escribe «PERC.I.V.A.» no coincidía y
   ese crédito se perdía, y cualquier renglón con esas letras se restaba sin que
   nadie lo mirara. Ahora computa lo confirmado, y lo que se parece se propone. */
const TRIB_NOMBRE = {percepcion_iva:'Percepción IVA', retencion_iva:'Retención IVA',
  percepcion_iibb:'Percepción IIBB', retencion_iibb:'Retención IIBB',

      directo en la DJ y se anota a mano en ARCA al presentarla — igual que el SIRCREB y lo de
      rentas de cada provincia.<br>Lo confirmado ya computa. Lo que solo <i>se parece</i> no se

function banTildar(id){
  banSel.has(id) ? banSel.delete(id) : banSel.add(id);
  const c = $('#ban-cuenta'); if (c) c.textContent = banSel.size;
}

async function tiparTildados(){
  if (!banSel.size) return toast('No tildaste ninguno', true);
  const t = val('ban-trib');
  try{
    const r = await post('/api/c/bancos/tributos',
      {movimientos:[...banSel], tributo:t, jurisdiccion: val('ban-jur')});
    toast(`${r.tipados} movimiento(s) — las DJ se recalculan`);
    banSel.clear(); fBanco();
  }catch(e){ toast(e.message, true); }
}

/* A cada uno el suyo: en la misma lista puede haber percepción de IVA y de
   IIBB, y mandarlas todas al mismo impuesto sería peor que no computarlas. */
async function confirmarTodos(ids){
  const r = await modal('Confirmar lo que parece',
    `Se van a confirmar <b>${ids.length}</b> débitos, cada uno con el tributo que el concepto
     del extracto dice que es.<br><br>Desde ese momento <b>se descuentan de la DJ</b> de su
     impuesto. Los que el concepto no alcance a identificar quedan como están.`, [], 'Confirmar');
  if (!r) return;
  try{
    const res = await post('/api/c/bancos/tributos', {movimientos:ids, parece:true});
    toast(`${res.tipados} confirmado(s)`); banSel.clear(); fBanco();
  }catch(e){ toast(e.message, true); }
}

async function destipar(id){
  try{
    await post('/api/c/bancos/tributos', {movimientos:[id], tributo:''});
    toast('Sacado de las DJ'); fBanco();
  }catch(e){ toast(e.message, true); }
}

function calcIVA(){
  const neto = num('nf-neto') || 0, a = parseFloat(val('nf-alic')) || 0;
  $('#nf-iva').value = (neto * a / 100).toFixed(2); calcTotal();
}
function calcTotal(){
  $('#nf-total').value = ((num('nf-neto')||0) + (num('nf-iva')||0) + (num('nf-perc')||0)).toFixed(2);
}
async function altaFactura(){
  try{
    const cuerpo = {mov: fMov, entidad_id: +val('nf-ent'), fecha: val('nf-fecha'), tipo: val('nf-tipo'),
      letra: val('nf-letra'), punto_venta: val('nf-pv'), numero: val('nf-num'),
      neto: num('nf-neto'), alicuota_iva: num('nf-alic'), iva: num('nf-iva'),
      percepciones: num('nf-perc'), total: num('nf-total')};
    if (fMov === 'venta' && val('nf-act') !== ''){
      const a = ACT[+val('nf-act')];
      if (a) Object.assign(cuerpo, {iibb_jurisdiccion:a.jurisdiccion, iibb_codigo:a.codigo, iibb_alicuota:a.alicuota});
    }
    await post('/api/c/facturas', cuerpo); toast('Comprobante guardado'); vFacturas();
  }catch(e){ toast(e.message, true); }
}

   extractos —el primer renglón lo dice— pero tiene que poder corregirse: si
   el primer extracto que entró no es el más viejo, ese arranque no es el real. */
async function saldoArranque(id, actual, desde){
  const r = await modal('El saldo con el que arranca la cuenta',
    `El sistema conoce los movimientos <b>desde el primer extracto que se cargó</b>. Lo que la
     cuenta ya tenía antes no está en ningún movimiento, y sin este número «saldo» es la suma de
     lo cargado, no el saldo.<br><br>Normalmente lo pone solo el cargador de extractos, que lo
     saca del primer renglón. Corregilo si cargaste un extracto que no era el más viejo.`,
    [{id:'md-si', label:'Saldo al inicio',
      html:`<input id="md-si" type="number" step="0.01" value="${actual}">`},
     {id:'md-sf', label:'¿Desde qué día vale?',
      html:`<input id="md-sf" type="date" value="${desde}">`}], 'Guardar');
  if (!r) return;
  try{
    await post(`/api/c/cuentas/${id}/saldo-inicial`,
      {saldo_inicial: parseFloat(r['md-si'])||0, fecha: r['md-sf']});
    toast('Guardado — el saldo se recalcula'); vBancos();
  }catch(e){ toast(e.message, true); }
}

/* ══ CHEQUES ══ — el módulo del ERP, con sus pestañas.
   Del original se sacan dos cosas que acá no existen:
     · PRESTADOS y «me dieron» — el cheque recibido ES una cobranza;
     · entidad real / entidad fiscal — acá el cliente real ES el fiscal, y el
       proveedor real ES el fiscal. Un solo nombre por rol, sin fantasía.
   Quedan los tres nombres que sí importan: LIBRADOR (quién firmó) · CLIENTE
   (quién nos lo dio) · DESTINO (banco o proveedor). */
let chTab = 'tablero', chAlta = 'rec', chImpagas = [];
let DUP_ROJO = new Set(), DUP_AMBAR = new Set();

function marcaDup(id){
  return DUP_ROJO.has(id) ? ' style="background:rgba(196,97,76,.18)" title="⚠ CARGADO DOS VECES: hay otro cheque con el mismo número, importe, vencimiento y banco."'
    : DUP_AMBAR.has(id) ? ' style="background:rgba(208,166,75,.14)" title="⚠ Mismo número y mismo banco = el mismo cheque, aunque la fecha o el importe difieran. Sobra una fila."'
    : '';
}

async function vCheques(){
  cargando('Cheques');
  const tabs = [['tablero','Tablero'],['recibidos','Recibidos / Cartera'],
                ['emitidos','Emitidos'],['nuevo','Cargar nuevo']];
  pintar(`<h2>Cheques</h2>
    <div class="sub">Solo dos clases: los <b>cobrados</b> —que entran por una cobranza y se
      pueden depositar o endosar— y los <b>emitidos</b> por la empresa.
      No hay "me dieron" ni "me prestaron", y el cliente real es el fiscal.</div>
    <div class="tabs">${tabs.map(([k,t]) =>
      `<button class="${chTab===k?'on':''}" onclick="chTab='${k}';vCheques()">${t}</button>`).join('')}</div>
    <div id="ch-panel"><div class="vacio">Cargando…</div></div>`);
  ({tablero:chTablero, recibidos:chRecibidos, emitidos:chEmitidos, nuevo:chNuevo}[chTab])();
}
const panelCh = h => { const c = $('#ch-panel'); if (c) c.innerHTML = h; };

async function chCargarDups(){
  const dup = await api('/api/c/cheques/duplicados').catch(() => ({exactos:[], por_numero:[]}));
  DUP_ROJO = new Set(); DUP_AMBAR = new Set();
  dup.exactos.forEach(g => g.cheques.slice(1).forEach(c => DUP_ROJO.add(c.id)));
  dup.por_numero.forEach(g => g.cheques.slice(1).forEach(c => DUP_AMBAR.add(c.id)));
  return dup;
}

/* ── TABLERO ──
   Los VENCIMIENTOS POR PLAZO son lo que lo hace útil: «vence en noviembre» no
   sirve, «esto vence esta semana» sí. Y se separa lo que ENTRA de lo que SALE,

      <b>${dup.n_exactos + dup.n_por_numero} cheque(s) parecen estar cargados dos veces.</b>
      ${dup.importe_de_mas ? `Hay ${plata(dup.importe_de_mas)} contados de más. ` : ''}

    <div class="panel" style="margin-top:16px"><div class="panel-h">
      <b>Vencimientos por plazo</b>
      <span class="mini">al ${fecha(d.hoy)}</span></div>
      <div class="panel-b">
        <div class="mini" style="margin-bottom:10px">Un día con mucho a cobrar y mucho a pagar

        ${graficoPlazos(d.plazos)}

          {n: p.pago ? `<span class="neg">${plata(p.pago)}</span><div class="mini">${p.pago_n} chq</div>` : '—'},
          {n: `<span class="${p.neto<0?'neg':'pos'}">${plata(p.neto)}</span>`},
          {n: `<b class="${p.acumulado<0?'neg':''}">${plata(p.acumulado)}</b>`}]))}
    </div>

    ${d.por_librador.length ? `<div class="panel"><div class="panel-h">

/* Las barras por plazo: lo que entra arriba, lo que sale abajo, y la línea del
   acumulado. Con una sola escala se ve la relación, que es de lo que se trata. */
function graficoPlazos(ps){
  if (!ps.length) return '';
  const W = 700, H = 200, M = {arriba:16, abajo:34, izq:8, der:8};
  const ancho = W - M.izq - M.der, alto = H - M.arriba - M.abajo;
  const tope = Math.max(...ps.map(p => Math.max(p.cobro, p.pago)), 1);
  const cero = M.arriba + alto / 2;
  const y = v => cero - (v / tope) * (alto / 2);
  const paso = ancho / ps.length, ab = Math.min(28, paso * 0.34);
  const x = i => M.izq + paso * i + paso / 2;
  const AZUL = '#7FB2DA', ROJO = '#E28873';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">
    <line x1="${M.izq}" y1="${cero}" x2="${W-M.der}" y2="${cero}" stroke="var(--bor)"/>
    ${ps.map((p,i) => `
      <rect x="${x(i)-ab-1}" y="${y(p.cobro)}" width="${ab}" height="${Math.max(cero-y(p.cobro),0)}"
        fill="${AZUL}" opacity=".8"><title>${p.plazo}\nA cobrar: ${plata(p.cobro)}</title></rect>
      <rect x="${x(i)+1}" y="${cero}" width="${ab}" height="${Math.max(cero-y(p.pago),0)}"
        fill="${ROJO}" opacity=".8"><title>${p.plazo}\nA pagar: ${plata(p.pago)}</title></rect>
      <text x="${x(i)}" y="${H-18}" text-anchor="middle" font-size="9"
        fill="var(--mut)">${p.plazo}</text>`).join('')}
    </svg>
    <div class="mini"><span style="color:${AZUL}">■</span> a cobrar ·
      <span style="color:${ROJO}">■</span> a pagar — pasá el mouse para ver los montos</div></div>`;
}

      <b>proveedor</b> (endosado) o en un <b>banco</b> (depositado).

   una cobranza, cargarlos de a uno con diez confirmaciones es donde la gente
   deja de cargarlos.

   El RECIBIDO arma una cobranza por debajo: el botón es nuevo, la puerta es la
   misma. Un cheque recibido suelto sería plata en cartera sin dueño. */

function chNuevo(){
  panelCh(`
    <div class="tabs">
      <button class="${chAlta==='rec'?'on':''}" onclick="chAlta='rec';chNuevo()">Recibido (cobranza)</button>
      <button class="${chAlta==='emi'?'on':''}" onclick="chAlta='emi';chNuevo()">Emitido</button>
    </div>
    ${chAlta === 'rec' ? formRecibido() : formEmitido()}
    ${chLote.length ? `<div class="panel"><div class="panel-h">
      <b>${chLote.length} cheque(s) en la lista</b>
      <span class="mini">${plata(chLote.reduce((s,c)=>s+(c.importe||0),0))}</span></div>
      ${tabla(['Número','Banco','Vence','Importe',''], chLote.map((c,i) =>
        [esc(c.numero), esc(c.banco||'—'), fecha(c.fecha_pago), {n:plata(c.importe)},
         `<button class="g xs" onclick="chLote.splice(${i},1);chNuevo()">Quitar</button>`]))}
      <div class="panel-b"><button onclick="guardarLote()">Guardar los ${chLote.length}</button></div>
    </div>` : ''}`);
  if (chAlta === 'rec') chImpagasDe();
}

/* El número que sigue sale de la chequera, no de la memoria de nadie. */
async function proximoNumero(){
  const cta = val('ne-cta'); const eco = $('#ne-prox'); if (!eco) return;
  if (!cta) return eco.textContent = '';
  const d = await api('/api/c/chequeras/proximo?cuenta_id=' + cta).catch(() => ({}));
  if (d.proximo){
    if (!val('ne-num')) $('#ne-num').value = d.proximo;
    eco.innerHTML = `<span class="pos">sigue el ${esc(d.proximo)}</span> · quedan ${d.quedan}`;
  } else eco.textContent = d.nota || '';
}
async function buscarBancoChq(){
  const q = val('nr-banco'); if (q.length < 2) return;
  const bs = await api('/api/bancos/maestro?q=' + encodeURIComponent(q)).catch(() => []);
  const dl = $('#dl-bancos-chq');
  if (dl) dl.innerHTML = bs.map(b => `<option value="${esc(b.nombre)}">${esc(b.nombre_corto)}</option>`).join('');
}

function agregarALote(){
  const c = {numero: val('nr-num'), banco: val('nr-banco'), importe: num('nr-imp'),
             fecha_emision: val('nr-fe'), fecha_pago: val('nr-fp'),
             librador_nombre: val('nr-lib-nom'), cuit_librador: val('nr-lib-cuit')};
  if (!c.numero) return toast('Falta el número del cheque', true);
  if (!c.importe) return toast('Falta el importe', true);
  chLote.push(c);
  ['nr-num','nr-imp'].forEach(id => { const e = $('#'+id); if (e) e.value = ''; });
  chNuevo();
  toast(`${chLote.length} en la lista`);
}
async function guardarLote(){
  const aplicaciones = chImpagas.map((f,i) => $('#nrf-'+i)?.checked ? {factura_id:f.id, importe:f.saldo} : null)
    .filter(Boolean);
  try{
    await post('/api/c/pagos', {direccion:'cobro', entidad_id:+val('nr-ent'),
      fecha: val('nr-fecha'), numero: val('nr-recibo'), aplicaciones,
      medios: chLote.map(c => ({medio:'cheque', importe:c.importe, cheque:c}))});
    toast(`${chLote.length} cheque(s) en cartera — quedó un solo recibo`);
    chLote = []; chTab = 'recibidos'; vCheques();
  }catch(e){ toast(e.message, true); }
}

/* Qué se puede hacer con un cheque según dónde está. Un cheque rechazado no
   se deposita: se repone o se canjea. Mostrar botones que van a fallar es
   peor que no mostrarlos. */
function accionesCheque(c){
  const hist = `<button class="g xs" onclick="historialCheque(${c.id},'${esc(c.numero)}')">Historial</button>`;
  if (c.estado === 'rechazado') return `<div class="row-act">
    <button class="g xs" onclick="reponerCheque(${c.id},'${esc(c.numero)}')">Reponer</button>
    <button class="g xs" onclick="canjearCheque(${c.id},'${esc(c.numero)}',${c.importe})">Lo cambiaron</button>
    ${hist}</div>`;
  if (c.estado === 'en_cartera') return `<div class="row-act">
    <button class="g xs" onclick="depositar(${c.id})">Depositar</button>
    <button class="g xs" onclick="endosar(${c.id})">Endosar</button>
    <button class="g xs" onclick="rebotar(${c.id},'${esc(c.numero)}',${c.importe},'${esc(c.librador||'')}')">Rebotó</button>
    ${hist}</div>`;
  if (['depositado','cobrado','emitido','endosado'].includes(c.estado)) return `<div class="row-act">
    <button class="g xs" onclick="rebotar(${c.id},'${esc(c.numero)}',${c.importe},'${esc(c.librador||'')}')">Rebotó</button>
    ${hist}</div>`;
  return `<div class="row-act">${hist}</div>`;
}

/* El tilde COPIA el cliente al librador y bloquea los campos: queda escrito que
   lo firmó él porque alguien lo dijo, no porque el sistema lo haya supuesto. */
function chLibradorIgual(){
  const igual = $('#nr-lib-igual').checked;
  const e = ENT.find(x => x.id === +val('nr-ent'));
  const nom = $('#nr-lib-nom'), cuit = $('#nr-lib-cuit');
  if (igual && !e){ $('#nr-lib-igual').checked = false; return toast('Elegí primero el cliente', true); }
  if (igual){ nom.value = e.razon_social; cuit.value = e.cuit || ''; }
  else { nom.value = ''; cuit.value = ''; }
  nom.disabled = cuit.disabled = igual;
}

async function chImpagasDe(){
  const cont = $('#nr-facturas'); if (!cont) return;
  if ($('#nr-lib-igual')?.checked) chLibradorIgual();
  const eid = +val('nr-ent');
  if (!eid){ chImpagas = []; cont.textContent = 'Elegí un cliente…'; return; }
  chImpagas = (await api('/api/c/facturas?mov=venta&impagas=1')).filter(f => f.entidad_id === eid);
  cont.innerHTML = chImpagas.length ? chImpagas.map((f,i) => `
    <label class="chk">
      <input type="checkbox" id="nrf-${i}" onchange="chSumar()">
      ${esc(f.tipo)} ${esc(f.punto_venta||'')}-${esc(f.numero||'')} · ${fecha(f.fecha)} ·
      saldo <b>${plata(f.saldo)}</b></label>`).join('')
    + '<div class="mini" style="margin-top:6px">Si no tildás ninguna, la cobranza queda <b>a cuenta</b> y se imputa después.</div>'
    : '<span class="mini">No tiene facturas impagas — la cobranza va a quedar a cuenta.</span>';
}
/* El importe del cheque se propone con lo que suman las facturas tildadas: casi
   siempre es eso, y si no, se pisa a mano. */
function chSumar(){
  const t = chImpagas.reduce((s,f,i) => s + ($('#nrf-'+i)?.checked ? f.saldo : 0), 0);
  const inp = $('#nr-imp'); if (inp && t) inp.value = t.toFixed(2);
}

}

async function altaChequeEmitido(){

/* ── EL CHEQUE QUE REBOTA ──
   Acá el librador deja de ser un dato de archivo. Mientras el cheque anda bien
   alcanza con quién nos lo dio y a quién se lo dimos —eso concilia facturas—;
   cuando rebota la pregunta cambia: a quién se le reclama. Y el DEPOSITANTE el
   banco recién lo informa en el rechazo, así que pedirlo antes sería pedir un
   dato que nadie tiene. */
async function rebotar(id, numero, importe, libradorActual){
  const r = await modal(`El cheque Nº${esc(numero)} rebotó`,
    'Se registra el rechazo y <b>la factura que este cheque canceló vuelve a deber</b> '
    + `${plata(importe)}. Un cheque rechazado no pagó nada: si la cobranza queda como estaba, `
    + 'el cliente figura al día debiendo.<br><br>'
    + '<b>Los dos datos de abajo se piden recién ahora</b> y no al cargarlo: el librador '
    + 'importa cuando hay que reclamar, y el depositante lo informa el banco en el rechazo.',
    [
      {id:'md-motivo', label:'Por qué rebotó',
       html:`<select id="md-motivo">
         <option>Sin fondos suficientes</option>
         <option>Sin fondos suficientes con aviso</option>
         <option>Cuenta cerrada</option>
         <option>Orden de no pagar</option>
         <option>Defectos formales (firma, fecha, endoso)</option>
         <option>Otro</option></select>`},
      {id:'md-fecha', label:'Fecha del rechazo',
       html:`<input type="date" id="md-fecha" value="${hoy()}">`, ancho:''},
      {id:'md-lib', label:'Quién firmó el cheque (a quién se le reclama)',
       html:`<input id="md-lib" value="${esc(libradorActual || '')}" placeholder="razón social del librador">`},
      {id:'md-libcuit', label:'CUIT del librador',
       html:'<input id="md-libcuit" placeholder="opcional">', ancho:''},
      {id:'md-dep', label:'Quién lo depositó (lo dice el banco en el rechazo)',
       html:'<input id="md-dep" placeholder="opcional">', ancho:''},
    ], 'Registrar el rechazo');
  if (!r) return;
  try{
    const res = await post(`/api/c/cheques/${id}/rechazo`, {
      motivo: r['md-motivo'], fecha: r['md-fecha'],
      librador_nombre: r['md-lib'], librador_cuit: r['md-libcuit'],
      depositante: r['md-dep']});
    toast('Rechazo registrado' + (res.deshecho?.length ? ' · ' + res.deshecho[0] : ''));
    vCheques();
  }catch(e){ toast(e.message, true); }
}

async function reponerCheque(id, numero){
  const r = await modal(`Volver a poner el Nº${esc(numero)} en la cola`,
    'Vuelve al estado que tenía antes del rechazo, para presentarlo de nuevo o reclamarlo.'
    + '<br><br>Se separa del rechazo a propósito: entre que rebota y que se decide qué hacer '
    + 'puede pasar tiempo, y mientras tanto tiene que <b>verse como rechazado</b>, no como si '
    + 'nada hubiera pasado.', [], 'Reponer');

    toast('Repuesto'); vCheques(); }catch(e){ toast(e.message, true); }
}

async function canjearCheque(id, numero, importe){
  const r = await modal(`Lo cambiaron por otro cheque`,
    `El Nº${esc(numero)} se cierra como <b>canjeado</b> y nace el reemplazo, atado a él.`
    + '<br><br>Los dos quedan: si se pisara el viejo, el rebote desaparecería del historial '
    + 'y nadie sabría que este cliente ya rebotó una vez.',
    [
      {id:'md-num', label:'Número del cheque nuevo', html:'<input id="md-num">', ancho:''},
      {id:'md-banco', label:'Banco', html:'<input id="md-banco">', ancho:''},
      {id:'md-imp', label:'Importe',
       html:`<input id="md-imp" type="number" step="0.01" value="${importe}">`, ancho:''},
      {id:'md-fp', label:'Vencimiento', html:`<input type="date" id="md-fp" value="${hoy()}">`, ancho:''},
    ], 'Registrar el canje');

/* La vida del cheque, para cuando hay que explicar por dónde anduvo. */

      ${d.cheque.depositante ? `<br>lo depositó ${esc(d.cheque.depositante)}` : ''}</div>

/* ══ PAGOS ══ */
let pDir = 'pago', pFacturas = [], pMedios = [];
async function vPagos(){

  const ps = await api('/api/c/pagos');
  pintar(`
    <h2>Pagos y cobranzas</h2>
    <div class="sub">Se cancelan <b>facturas</b> —no hay certificados ni órdenes de compra, y no se
      separa por obra— con movimientos de banco, cheques o efectivo.
      Lo que se paga por banco deja el CUIT y el recibo pegados al movimiento.</div>
    <div class="row-act" style="margin-bottom:16px">
      <button onclick="abrirPago('pago')">+ Nuevo pago</button>
      <button class="g" onclick="abrirPago('cobro')">+ Nueva cobranza</button>
    </div>
    <div class="panel hide" id="p-alta"><div class="panel-h">
      <b id="p-titulo">${pDir==='pago'?'Nuevo pago a proveedor':'Nueva cobranza de cliente'}</b>
      <button class="g xs" onclick="toggle('#p-alta')">Cerrar</button></div>
      <div class="panel-b">
        <div class="tabs">
          <button class="${pDir==='pago'?'on':''}" onclick="abrirPago('pago',1)">Pago a proveedor</button>
          <button class="${pDir==='cobro'?'on':''}" onclick="abrirPago('cobro',1)">Cobranza de cliente</button>
        </div>
        <div class="f">
          <div class="full"><label>${pDir==='pago'?'Proveedor':'Cliente'}</label>
            <select id="np-ent" onchange="cargarImpagas()">${
              optEnt(e => pDir==='pago' ? e.es_proveedor : e.es_cliente) || optEnt()}</select></div>
          <div><label>Fecha</label><input type="date" id="np-fecha" value="${hoy()}"></div>
          <div><label>Nº recibo / OP</label><input id="np-num"></div>
        </div>
        <div style="margin-top:14px"><b style="font-size:13px">Facturas a cancelar</b>
          <div id="np-facturas" class="mini" style="margin-top:6px">Elegí una entidad…</div></div>
        <div style="margin-top:14px"><b style="font-size:13px">Con qué se paga</b>
          <div id="np-medios" style="margin-top:6px"></div>
          <div class="row-act" style="margin-top:8px">
            <button class="g xs" onclick="addMedio('efectivo')">+ Efectivo</button>
            <button class="g xs" onclick="addMedio('transferencia')">+ Transferencia</button>
            <button class="g xs" onclick="addMedio('cheque')">+ Cheque</button>
          </div></div>
        <div style="margin-top:16px"><button onclick="guardarPago()">Guardar comprobante</button></div>
      </div>
    </div>
    ${ps.length ? `<div class="panel"><div class="panel-h"><b>${ps.length} comprobante(s)</b>
      <span class="mini">clic en una fila para ver la ficha, corregirla o anularla</span></div>
      ${tabla(['Fecha','Tipo','Entidad','Nº','Medios','Aplica a','Retenciones','Total'],
        ps.map(p => [fecha(p.fecha),
          p.anulado ? '<span class="badge b-bad">anulado</span>'
            : p.direccion === 'cobro' ? '<span class="badge b-ok">cobranza</span>' : '<span class="badge b-warn">pago</span>',
          esc(p.entidad), esc(p.numero||'—'),
          `<span class="mini">${p.medios.map(m => esc(m.medio)).join(', ')}</span>`,
          `<span class="mini">${p.aplicaciones.map(a => `${esc(a.tipo)} ${esc(a.numero||a.factura_id)}`).join(', ') || '—'}</span>`,
          p.anulado ? '<span class="mini">—</span>'
            : `<button class="g xs" onclick="event.stopPropagation();verRetenciones(${p.id}, '${esc(p.numero||('recibo '+p.id))}')">${
              p.retenido ? plata(p.retenido) : 'cargar'}</button>`,
          {n:plata(p.total)}]),
        {onclick: i => `verRecibo(${ps[i].id})`,
         fila: i => ps[i].anulado ? ' style="opacity:.45"' : ''})}
