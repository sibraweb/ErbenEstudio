/* Abrir ya elige la dirección: antes había que abrir el panel y DESPUÉS
   acordarse de tildar la pestaña, y quedaban cobranzas cargadas como pagos. */
function abrirPago(dir, yaAbierto){
  pDir = dir;
  if (!yaAbierto) $('#p-alta').classList.remove('hide');
  const tit = $('#p-titulo');
  if (tit) tit.textContent = dir === 'pago' ? 'Nuevo pago a proveedor' : 'Nueva cobranza de cliente';
  const lbl = $('#np-ent')?.previousElementSibling;
  if (lbl) lbl.textContent = dir === 'pago' ? 'Proveedor' : 'Cliente';
  prepararPago();
}
function prepararPago(){ pMedios = []; pintarMedios(); cargarImpagas();
  const s = $('#np-ent'); if (s) s.innerHTML = optEnt(e => pDir==='pago' ? e.es_proveedor : e.es_cliente) || optEnt();
  document.querySelectorAll('#p-alta .tabs button').forEach((b,i) =>
    b.classList.toggle('on', (i===0) === (pDir==='pago')));
}
async function cargarImpagas(){
  const cont = $('#np-facturas'); if (!cont) return;
  const eid = +val('np-ent'); if (!eid) return cont.textContent = 'Elegí una entidad…';
  const mov = pDir === 'pago' ? 'compra' : 'venta';
  const fs = (await api(`/api/c/facturas?mov=${mov}&impagas=1`)).filter(f => f.entidad_id === eid);
  pFacturas = fs;
  cont.innerHTML = fs.length ? fs.map((f,i) => `
    <label class="chk">
      <input type="checkbox" id="pf-${i}" onchange="sumarSel()">
      ${esc(f.tipo)} ${esc(f.punto_venta||'')}-${esc(f.numero||'')} · ${fecha(f.fecha)} ·
      saldo <b>${plata(f.saldo)}</b></label>`).join('')
    : '<span class="mini">No tiene facturas impagas.</span>';
}
function sumarSel(){
  const t = pFacturas.reduce((s,f,i) => s + ($('#pf-'+i)?.checked ? f.saldo : 0), 0);
  if (pMedios.length === 1) { const inp = $('#pm-imp-0'); if (inp && !inp.value) inp.value = t.toFixed(2); }
}
function addMedio(medio){ pMedios.push({medio}); pintarMedios(); }
function quitarMedio(i){ pMedios.splice(i,1); pintarMedios(); }
function pintarMedios(){
  const c = $('#np-medios'); if (!c) return;
  c.innerHTML = pMedios.map((m,i) => `
    <div class="cand" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <b>${m.medio}</b><button class="g xs" onclick="quitarMedio(${i})">Quitar</button></div>
      <div class="f">
        <div><label>Importe</label><input id="pm-imp-${i}" type="number" step="0.01"></div>
        ${m.medio === 'transferencia' ? `<div class="full"><label>Movimiento del banco</label>
          <select id="pm-mov-${i}"><option value="">Cargando…</option></select></div>` : ''}
        ${m.medio === 'cheque' ? (pDir === 'pago' ? `
          <div class="full"><label>Cheque de cartera a endosar (o dejar vacío y emitir uno nuevo)</label>
            <select id="pm-chq-${i}" onchange="toggleChqNuevo(${i})"><option value="">— emitir uno nuevo —</option></select></div>
          <div class="full chq-nuevo-${i}"><div class="f">
            <div><label>Número</label><input id="pm-num-${i}"></div>
            <div><label>Banco</label><input id="pm-banco-${i}"></div>
            <div><label>Fecha de pago</label><input type="date" id="pm-fp-${i}" value="${hoy()}"></div>
          </div></div>` : `
          <div class="full"><div class="f">
            <div><label>Número</label><input id="pm-num-${i}"></div>
            <div><label>Banco</label><input id="pm-banco-${i}"></div>
            <div><label>Fecha de pago</label><input type="date" id="pm-fp-${i}" value="${hoy()}"></div>
            <div><label>CUIT librador</label><input id="pm-lib-${i}" placeholder="opcional"></div>
          </div></div>`) : ''}
      </div>
    </div>`).join('') || '<span class="mini">Agregá al menos un medio.</span>';
  pMedios.forEach((m,i) => {
    if (m.medio === 'transferencia') api('/api/c/movimientos?pendientes=1').then(ms => {
      const s = $('#pm-mov-'+i); if (!s) return;
      s.innerHTML = '<option value="">— elegir —</option>' + ms.map(x =>
        `<option value="${x.id}">${fecha(x.fecha)} · ${esc(x.banco)} · ${plata(x.importe)} · ${esc((x.descripcion||'').slice(0,32))}</option>`).join('');
    });
    if (m.medio === 'cheque' && pDir === 'pago') api('/api/c/cheques?estado=en_cartera').then(cs => {
      const s = $('#pm-chq-'+i); if (!s) return;
      s.innerHTML = '<option value="">— emitir uno nuevo —</option>' + cs.map(x =>
        `<option value="${x.id}">${esc(x.numero)} · ${esc(x.banco||'')} · ${plata(x.importe)} · vence ${fecha(x.fecha_pago)}</option>`).join('');
    });
  });
}
function toggleChqNuevo(i){
  const usa = val('pm-chq-'+i) !== '';
  document.querySelectorAll('.chq-nuevo-'+i).forEach(e => e.classList.toggle('hide', usa));
}
async function guardarPago(){
  try{
    const aplicaciones = pFacturas.map((f,i) => $('#pf-'+i)?.checked ? {factura_id:f.id, importe:f.saldo} : null)
      .filter(Boolean);
    const medios = pMedios.map((m,i) => {
      const base = {medio:m.medio, importe:num('pm-imp-'+i)};
      if (m.medio === 'transferencia') base.movimiento_id = +val('pm-mov-'+i) || null;
      if (m.medio === 'cheque'){
        const enCartera = pDir === 'pago' ? val('pm-chq-'+i) : '';
        if (enCartera) base.cheque_id = +enCartera;
        else base.cheque = {numero: val('pm-num-'+i), banco: val('pm-banco-'+i),
          fecha_pago: val('pm-fp-'+i), cuit_librador: val('pm-lib-'+i)};
      }
      return base;
    });
    await post('/api/c/pagos', {direccion:pDir, entidad_id:+val('np-ent'), fecha:val('np-fecha'),
      numero:val('np-num'), aplicaciones, medios});
    toast('Comprobante guardado — el banco quedó actualizado'); pMedios = []; vPagos();
  }catch(e){ toast(e.message, true); }
}

/* ══ LA FICHA DE UN RECIBO, Y CÓMO DESHACER ══
   Era el único lugar del sistema del que no se podía salir operando: si el
   FIFO imputaba mal, la factura vieja quedaba «saldada» sin estarlo y había
   que abrir la base a mano.

   Regla de estas pantallas: **cada botón dice qué va a pasar ANTES de
   hacerlo**. Nadie tiene que adivinar qué se lleva puesto «Anular». */
async function verRecibo(pid){
  let d;
  try{ d = await api(`/api/c/pagos/${pid}`); }
  catch(e){ return toast(e.message, true); }
  const viejo = $('#modal-rec'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-rec';
  const esCobro = d.direccion === 'cobro';
  el.innerHTML = `<div class="box" style="max-width:820px">
    <h3>${esCobro ? 'Cobranza' : 'Orden de pago'} ${esc(d.numero || '#'+d.id)}</h3>
    <div class="mini" style="margin-bottom:12px">${esc(d.entidad)} · ${fecha(d.fecha)} ·
      total <b>${plata(d.total)}</b>
      ${d.a_cuenta > 0.01 ? ` · <b class="amb">${plata(d.a_cuenta)} a cuenta</b>` : ''}
      ${d.anulado ? ` · <span class="badge b-bad">ANULADO</span> ${esc(d.anulado_motivo||'')}` : ''}</div>

    ${d.anulado ? `<div class="aviso">Este comprobante está anulado desde el
      ${fecha(d.anulado_fecha)}. Se conserva —el número ya se usó— pero no cuenta en ningún saldo.</div>`
    : `
    <div class="panel" style="margin-bottom:14px"><div class="panel-h">
      <b>Con qué se pagó</b>
      <button class="g xs" onclick="corregirMedios(${pid})">Corregir</button></div>
      ${d.medios.length ? tabla(['Medio','Detalle','Importe'], d.medios.map(m =>
        [esc(m.medio), esc(m.detalle_banco || m.detalle_cheque || '—'), {n:plata(m.importe)}]))
        : '<div class="vacio">Sin medios.</div>'}
    </div>

    <div class="panel" style="margin-bottom:14px"><div class="panel-h">
      <b>Qué facturas cancela</b>
      <span class="mini">${plata(d.aplicado)} aplicado</span></div>
      ${d.aplicaciones.length ? tabla(['Comprobante','Fecha','Total','Aplica','Le queda','']
        , d.aplicaciones.map(a => [
          `${esc(a.tipo)} ${esc(a.letra||'')} ${esc(a.punto_venta||'')}-${esc(a.numero||'')}`,
          fecha(a.fecha), {n:plata(a.total)}, {n:plata(a.importe)},
          {n: a.saldo_factura > 0.01 ? `<span class="neg">${plata(a.saldo_factura)}</span>`
             : '<span class="badge b-ok">saldada</span>'},
          `<button class="g xs" onclick="soltarFactura(${pid},${a.factura_id},'${esc((a.tipo||'')+' '+(a.punto_venta||'')+'-'+(a.numero||''))}',${a.importe})">Soltar</button>`]))
        : `<div class="vacio">No cancela ninguna factura todavía — está a cuenta.<br>
           <span class="mini">Se imputa desde la lista de comprobantes.</span></div>`}
      ${d.aplicaciones.length ? `<div class="panel-b"><div class="mini">
        <b>Soltar</b> desengancha esa factura de este recibo: la factura vuelve a deber
        y el recibo queda a cuenta por ese importe. No se borra nada.</div></div>` : ''}
    </div>

    ${d.retenciones.length ? `<div class="panel" style="margin-bottom:14px">
      <div class="panel-h"><b>Retenciones</b>
        <button class="g xs" onclick="$('#modal-rec').remove();verRetenciones(${pid},'${esc(d.numero||('recibo '+pid))}')">Editar</button></div>
      ${tabla(['Concepto','Certificado','Importe'], d.retenciones.map(r =>
        [esc((r.tipo||'').replace(/_/g,' ')),
         r.certificado ? esc(r.certificado) : '<span class="neg">sin certificado</span>',
         {n:plata(r.monto)}]))}
    </div>` : ''}

    <div class="aviso" style="border-left-color:var(--bad)">
      <b>Anular este comprobante</b> deshace todo lo que provocó:
      ${d.aplicaciones.length ? `<br>· ${d.aplicaciones.length} factura(s) vuelven a deber` : ''}
      ${d.medios.some(m => m.movimiento_id) ? '<br>· el movimiento del banco queda sin registrar otra vez' : ''}
      ${d.medios.some(m => m.cheque_id) ? (esCobro
        ? '<br>· el cheque que trajo esta cobranza se anula con ella'
        : '<br>· el cheque endosado vuelve a cartera') : ''}
      ${d.retenciones.length ? `<br>· ${d.retenciones.length} retención(es) dejan de computarse` : ''}
      <br><span class="mini">El comprobante NO se borra: el número ya se usó y queda con su
      motivo, para que el papel que anda dando vueltas tenga respaldo.</span></div>`}

    <div class="row-act" style="justify-content:space-between;margin-top:16px">
      ${d.anulado ? '<span></span>'
        : `<button class="g" onclick="anularRecibo(${pid},'${esc(d.numero||('#'+pid))}')"
             style="border-color:var(--bad);color:var(--bad)">Anular este comprobante</button>`}
      <button onclick="$('#modal-rec').remove()">Cerrar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
}

async function soltarFactura(pid, fid, etiqueta, importe){
  const r = await modal('Soltar la factura del recibo',
    `Vas a desenganchar <b>${esc(etiqueta)}</b> de este comprobante.<br><br>`
    + `Después de esto: la factura <b>vuelve a deber ${plata(importe)}</b> y el recibo queda `
    + `<b>a cuenta</b> por ese importe, listo para imputar a la que corresponda.<br><br>`
    + `No se borra ni la factura ni el recibo.`,
    [], 'Soltar');
  if (!r) return;
  try{
    await api(`/api/c/pagos/${pid}/aplicaciones/${fid}`, {method:'DELETE'});
    toast('Soltada — la factura volvió a deber');
    $('#modal-rec')?.remove(); verRecibo(pid);
  }catch(e){ toast(e.message, true); }
}

async function anularRecibo(pid, etiqueta){
  const r = await modal('Anular el comprobante ' + etiqueta,
    'Se deshace todo lo que este comprobante provocó, y queda marcado como anulado '
    + '<b>sin borrarse</b> — el número ya se usó.<br><br>'
    + 'Hace falta el motivo: quien anula un recibo tiene que poder explicar por qué.',
    [{id:'md-motivo', label:'Por qué se anula',
      html:'<input id="md-motivo" placeholder="ej: se cargó dos veces, el cliente anuló la transferencia…">'}],
    'Anular');
  if (!r) return;
  if (!(r['md-motivo'] || '').trim()) return toast('Sin motivo no se anula', true);
  try{
    const res = await post(`/api/c/pagos/${pid}/anular`, {motivo: r['md-motivo']});
    $('#modal-rec')?.remove();
    toast('Anulado' + (res.deshecho?.length ? ' · ' + res.deshecho[0] : ''));
    vPagos();
  }catch(e){ toast(e.message, true); }
}

/* Corregir los medios sin perder el número de recibo. El caso de todos los
   días: se cargó efectivo y fue transferencia, o el cheque salió con otro
   número. Antes había que anular y cargar de nuevo. */
let CM = [];
async function corregirMedios(pid){
  const d = await api(`/api/c/pagos/${pid}`);
  CM = d.medios.map(m => ({medio:m.medio, importe:m.importe,
                           movimiento_id:m.movimiento_id, cheque_id:m.cheque_id}));
  const viejo = $('#modal-cm'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-cm';
  el.innerHTML = `<div class="box" style="max-width:720px">
    <h3>Con qué se pagó ${esc(d.numero || '#'+pid)}</h3>
    <div class="mini" style="margin-bottom:10px">Se rehace el bloque entero: lo viejo se suelta
      —el movimiento vuelve a estar sin conciliar, el cheque endosado vuelve a cartera— y se
      ata lo nuevo.
      ${d.aplicado ? `<br><b>Este recibo tiene ${plata(d.aplicado)} aplicado a facturas</b>, así que
        los medios nuevos tienen que sumar eso mismo. Si querés cambiar el importe, soltá alguna
        factura primero.` : ''}</div>
    <div id="cm-lista"></div>
    <div class="row-act" style="margin-top:10px">
      <button class="g xs" onclick="cmAgregar('efectivo')">+ Efectivo</button>
      <button class="g xs" onclick="cmAgregar('transferencia')">+ Transferencia</button>
      <button class="g xs" onclick="cmAgregar('cheque')">+ Cheque</button>
      <span class="mini" id="cm-suma" style="margin-left:8px"></span></div>
    <div class="row-act" style="justify-content:flex-end;margin-top:16px">
      <button class="g" onclick="$('#modal-cm').remove()">Cancelar</button>
      <button onclick="cmGuardar(${pid})">Guardar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  cmPintar(d.aplicado);
}
function cmPintar(aplicado){
  const c = $('#cm-lista'); if (!c) return;
  c.innerHTML = CM.map((m,i) => `
    <div class="cand" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <b>${esc(m.medio)}</b>
        <button class="g xs" onclick="CM.splice(${i},1);cmPintar(${aplicado})">Quitar</button></div>
      <div class="f">
        <div><label>Importe</label><input type="number" step="0.01" value="${m.importe ?? ''}"
          oninput="CM[${i}].importe=parseFloat(this.value)||0;cmSuma(${aplicado})"></div>
        ${m.medio === 'transferencia' ? `<div class="full"><label>Movimiento del banco</label>
          <select id="cm-mov-${i}" onchange="CM[${i}].movimiento_id=+this.value||null">
            <option value="">— elegir —</option></select></div>` : ''}
        ${m.medio === 'cheque' ? `<div class="full"><label>Cheque de cartera</label>
          <select id="cm-chq-${i}" onchange="CM[${i}].cheque_id=+this.value||null">
            <option value="">— elegir —</option></select></div>` : ''}
      </div></div>`).join('') || '<div class="vacio">Sin medios. Agregá al menos uno.</div>';
  CM.forEach((m,i) => {
    if (m.medio === 'transferencia') api('/api/c/movimientos?pendientes=1').then(ms => {
      const s = $('#cm-mov-'+i); if (!s) return;
      s.innerHTML = '<option value="">— elegir —</option>' + ms.map(x =>
        `<option value="${x.id}"${x.id===m.movimiento_id?' selected':''}>${fecha(x.fecha)} · ${esc(x.banco)} · ${plata(x.importe)}</option>`).join('');
    });
    if (m.medio === 'cheque') api('/api/c/cheques?estado=en_cartera').then(cs => {
      const s = $('#cm-chq-'+i); if (!s) return;
      s.innerHTML = '<option value="">— elegir —</option>' + cs.map(x =>
        `<option value="${x.id}"${x.id===m.cheque_id?' selected':''}>Nº${esc(x.numero)} · ${plata(x.importe)}</option>`).join('');
    });
  });
  cmSuma(aplicado);
}
function cmSuma(aplicado){
  const s = CM.reduce((a,m) => a + (parseFloat(m.importe)||0), 0);
  const el = $('#cm-suma'); if (!el) return;
  el.innerHTML = `suman ${plata(s)}` + (aplicado
    ? (Math.abs(s - aplicado) < 0.01 ? ' · <b class="pos">coincide con lo aplicado</b>'
       : ` · <b class="neg">tienen que sumar ${plata(aplicado)}</b>`) : '');
}
function cmAgregar(medio){ CM.push({medio, importe:0}); cmPintar(0); }
async function cmGuardar(pid){
  try{
    await post(`/api/c/pagos/${pid}/medios`, {medios: CM});
    $('#modal-cm')?.remove(); $('#modal-rec')?.remove();
    toast('Medios corregidos'); vPagos();
  }catch(e){ toast(e.message, true); }
}

async function deshacerConciliacion(cid, detalle){
  const r = await modal('Deshacer la conciliación',
    `El movimiento <b>${esc(detalle)}</b> vuelve a la lista de lo que falta explicar.<br><br>`
    + 'Si la conciliación había fabricado un recibo automático, ese recibo se va con ella.<br><br>'
    + '<b>Una conciliación equivocada es peor que ninguna</b>: el movimiento figura resuelto '
    + 'y deja de aparecer en lo que hay que mirar.',
    [], 'Deshacer');
  if (!r) return;
  try{ await api(`/api/c/conciliacion/${cid}`, {method:'DELETE'});
    toast('Deshecha — el movimiento volvió a la lista'); vTesoreria();
  }catch(e){ toast(e.message, true); }
}

/* ══ PERCEPCIONES Y RETENCIONES ══
   El catálogo se pide una vez y queda: es público y no cambia. */
let TRIB = [];
async function catTributos(){
  if (!TRIB.length) TRIB = await api('/api/tributos').catch(() => []);
  return TRIB;
}
const nombreTrib = c => (TRIB.find(t => t.codigo === c) || {}).nombre || c;

/* ── El desglose de una factura ──
   `percepciones` es el TOTAL que trae el comprobante (la columna «Otros
   Tributos» de ARCA). Acá se dice DE QUÉ es cada peso, porque de eso depende
   contra qué DJ se computa: la percepción de IVA es crédito en la de IVA, la
   de IIBB en la de IIBB. Lo que queda sin clasificar no computa en ninguna. */
let TF = [];
async function verTributos(fid, etiqueta){
  await catTributos();
  const d = await api(`/api/c/facturas/${fid}/tributos`);
  TF = d.tributos.map(t => ({...t}));
  if (!TF.length && d.total_comprobante)
    TF = [{tipo:'sin_clasificar', monto:d.total_comprobante}];
  abrirTributos(fid, etiqueta, d);
}
function abrirTributos(fid, etiqueta, d){
  const viejo = $('#modal-trib'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-trib';
  el.innerHTML = `<div class="box" style="max-width:720px">
    <h3>Tributos de ${esc(etiqueta)}</h3>
    <div class="mini" style="margin-bottom:10px">El comprobante dice
      <b>${plata(d.total_comprobante)}</b> en otros tributos. Decí de qué es cada peso:
      la percepción de <b>IVA</b> es crédito en la DJ de IVA, la de <b>IIBB</b> en la de IIBB.
      Lo que quede sin clasificar no se computa en ninguna.</div>
    <div id="tf-lista"></div>
    <div class="row-act" style="margin-top:10px">
      <button class="g xs" onclick="tfAgregar()">+ Tributo</button>
      <span class="mini" id="tf-suma" style="margin-left:8px"></span></div>
    <div class="row-act" style="justify-content:flex-end;margin-top:16px">
      <button class="g" onclick="$('#modal-trib').remove()">Cancelar</button>
      <button onclick="tfGuardar(${fid})">Guardar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  tfPintar(d.total_comprobante);
}
function tfPintar(declarado){
  const c = $('#tf-lista'); if (!c) return;
  c.innerHTML = TF.map((t,i) => `
    <div class="cand" style="display:block">
      <div class="f">
        <div class="full"><label>Concepto</label>
          <select onchange="TF[${i}].tipo=this.value;tfPintar(${declarado})">
            ${TRIB.map(x => `<option value="${x.codigo}"${x.codigo===t.tipo?' selected':''}>${esc(x.nombre)}</option>`).join('')}
          </select></div>
        <div><label>Monto</label><input type="number" step="0.01" value="${t.monto ?? ''}"
          oninput="TF[${i}].monto=parseFloat(this.value)||0;tfSuma(${declarado})"></div>
        <div><label>Jurisdicción</label><input value="${esc(t.jurisdiccion||'')}"
          oninput="TF[${i}].jurisdiccion=this.value" placeholder="Formosa"></div>
        <div style="display:flex;align-items:flex-end">
          <button class="g xs" onclick="TF.splice(${i},1);tfPintar(${declarado})">Quitar</button></div>
      </div></div>`).join('') || '<div class="vacio">Sin tributos.</div>';
  tfSuma(declarado);
}
function tfSuma(declarado){
  const s = TF.reduce((a,t) => a + (parseFloat(t.monto)||0), 0);
  const d = Math.round((declarado - s) * 100) / 100;
  const el = $('#tf-suma'); if (!el) return;
  el.innerHTML = `desglosado ${plata(s)} de ${plata(declarado)}`
    + (Math.abs(d) < 0.01 ? ' · <b class="pos">cierra</b>'
       : ` · <b class="neg">falta ${plata(d)}</b>`);
}
function tfAgregar(){ TF.push({tipo:'percepcion_iva', monto:0}); tfPintar(0); }
async function tfGuardar(fid){
  try{
    await post(`/api/c/facturas/${fid}/tributos`,
      {tributos: TF.filter(t => (parseFloat(t.monto)||0) !== 0)});
    $('#modal-trib')?.remove();
    toast('Tributos guardados — la posición de IVA se recalcula');
    vFacturas();
  }catch(e){ toast(e.message, true); }
}

/* ── Las retenciones de un recibo ──
   La ecuación que faltaba: medios de pago + retenciones = imputado a las
   facturas. Sin la segunda pata, una factura cobrada con retención queda
   impaga por la diferencia para siempre. */
let TR = [];
async function verRetenciones(pid, etiqueta){
  await catTributos();
  const d = await api(`/api/c/pagos/${pid}/retenciones`);
  TR = d.retenciones.map(r => ({...r}));
  const viejo = $('#modal-ret'); if (viejo) viejo.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal-ret';
  el.innerHTML = `<div class="box" style="max-width:760px">
    <h3>Retenciones de ${esc(etiqueta)}</h3>
    <div class="mini" id="tr-eco" style="margin-bottom:10px"></div>
    <div id="tr-lista"></div>
    <div class="row-act" style="margin-top:10px">
      <button class="g xs" onclick="trAgregar()">+ Retención</button></div>
    <div class="row-act" style="justify-content:flex-end;margin-top:16px">
      <button class="g" onclick="$('#modal-ret').remove()">Cancelar</button>
      <button onclick="trGuardar(${pid})">Guardar</button></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  trPintar(d);
}
function trPintar(d){
  const c = $('#tr-lista'); if (!c) return;
  const soloRet = TRIB.filter(t => t.clase === 'retencion');
  c.innerHTML = TR.map((r,i) => `
    <div class="cand" style="display:block">
      <div class="f">
        <div><label>Concepto</label>
          <select onchange="TR[${i}].tipo=this.value">
            ${soloRet.map(x => `<option value="${x.codigo}"${x.codigo===r.tipo?' selected':''}>${esc(x.nombre)}</option>`).join('')}
          </select></div>
        <div><label>Régimen</label><input value="${esc(r.codigo_regimen||'')}"
          placeholder="094" oninput="TR[${i}].codigo_regimen=this.value"></div>
        <div><label>Base (importe sujeto)</label><input type="number" step="0.01"
          value="${r.base ?? ''}" oninput="TR[${i}].base=parseFloat(this.value)||null"></div>
        <div><label>Monto retenido</label><input type="number" step="0.01" value="${r.monto ?? ''}"
          oninput="TR[${i}].monto=parseFloat(this.value)||0;trEco(${d.medios_de_pago},${d.imputado_a_facturas})"></div>
        <div><label>Nº certificado</label><input value="${esc(r.certificado||'')}"
          oninput="TR[${i}].certificado=this.value" placeholder="sin esto no se computa"></div>
        <div style="display:flex;align-items:flex-end">
          <button class="g xs" onclick="TR.splice(${i},1);trPintar(${JSON.stringify(d).replace(/"/g,'&quot;')})">Quitar</button></div>
      </div></div>`).join('') || '<div class="vacio">Sin retenciones.</div>';
  trEco(d.medios_de_pago, d.imputado_a_facturas);
}
function trEco(medios, aplicado){
  const s = TR.reduce((a,r) => a + (parseFloat(r.monto)||0), 0);
  const dif = Math.round((aplicado - (medios + s)) * 100) / 100;
  const el = $('#tr-eco'); if (!el) return;
  el.innerHTML = `Medios de pago <b>${plata(medios)}</b> + retenciones <b>${plata(s)}</b>
    = <b>${plata(medios + s)}</b> · imputado a facturas <b>${plata(aplicado)}</b>`
    + (!aplicado ? ' <span class="mini">(a cuenta: no hay nada imputado)</span>'
       : Math.abs(dif) < 0.01 ? ' · <b class="pos">cierra</b>'
       : ` · <b class="neg">faltan ${plata(dif)}</b>`)
    + '<br><span class="mini">Sin el número de certificado la retención no se puede computar en la DJ.</span>';
}
function trAgregar(){ TR.push({tipo:'retencion_iva', monto:0}); trPintar({medios_de_pago:0, imputado_a_facturas:0}); }
async function trGuardar(pid){
  try{
    await post(`/api/c/pagos/${pid}/retenciones`,
      {retenciones: TR.filter(r => (parseFloat(r.monto)||0) > 0)});
    $('#modal-ret')?.remove();
    toast('Retenciones guardadas'); vPagos();
  }catch(e){ toast(e.message, true); }
}

/* ══ CONCILIACIÓN — pestaña de Tesorería ══
   El conciliador vive DENTRO de Tesorería: es un cruce de plata, no una
   pantalla aparte. */
async function tConc(){
  const [ps, hechas] = await Promise.all([
    api('/api/c/conciliacion'),
    api('/api/c/conciliacion/hechas').catch(() => ({conciliaciones:[], total:0, automaticas:0})),
  ]);
  const unicos = ps.filter(p => p.unico).length, ambiguos = ps.filter(p => p.candidatos.length > 1).length;
  panelT(`
    <div class="aviso">Se concilia solo lo que tiene <b>un único</b> candidato. Con dos o más decide una
      persona: adivinar rompe la cuenta corriente en silencio. Cada conciliación deja su recibo.</div>
    <div class="grid">
      <div class="card"><div class="k">Sin conciliar</div><div class="v">${ps.length}</div></div>
      <div class="card"><div class="k">Se pueden solas</div><div class="v pos">${unicos}</div></div>
      <div class="card"><div class="k">Ambiguas</div><div class="v ${ambiguos?'neg':''}">${ambiguos}</div></div>
    </div>
    <div style="margin:16px 0"><button onclick="conciliarAuto()" ${unicos?'':'disabled'}>
      Conciliar las ${unicos} seguras</button></div>
    ${ps.length ? ps.map(p => `
      <div class="panel"><div class="panel-h">
        <div><b>${fecha(p.fecha)} · ${esc(p.banco)} ·
          <span class="${p.importe<0?'neg':'pos'}">${plata(p.importe)}</span></b>
          <div class="mini">${esc(p.descripcion || 'sin descripción')}</div></div>
        ${p.unico ? '<span class="badge b-ok">1 candidato</span>'
          : p.candidatos.length ? `<span class="badge b-warn">${p.candidatos.length} candidatos</span>`
          : '<span class="badge b-mut">sin candidato</span>'}</div>
        <div class="panel-b">${p.candidatos.length ? p.candidatos.map(c => `
          <div class="cand"><span>${esc(c.motivo)}</span>
            <button class="xs" onclick="conciliarManual(${p.id},'${c.tipo}',${c.id})">Conciliar</button></div>`).join('')
          : '<span class="mini">Nada coincide en monto, fecha y CUIT. Puede ser un gasto bancario, o falta cargar la factura.</span>'}
        </div>
      </div>`).join('')
      : '<div class="panel"><div class="vacio">Todo conciliado.</div></div>'}

    ${hechas.total ? `<div class="panel" style="margin-top:20px"><div class="panel-h">
      <b>Las que ya se hicieron</b>
      <span class="mini">${hechas.total} · ${hechas.automaticas} automática(s)</span></div>
      <div class="panel-b"><div class="mini">Faltaba poder verlas: se conciliaba y el movimiento
        desaparecía de la pantalla. <b>Una conciliación equivocada es peor que ninguna</b> — el
        movimiento figura resuelto y deja de aparecer en lo que hay que mirar.</div></div>
      ${tabla(['Fecha','Banco','Movimiento','Importe','Con qué','Cómo',''],
        hechas.conciliaciones.map(c => [
          fecha(c.mov_fecha), esc(c.banco), esc((c.descripcion||'').slice(0,38)),
          {n:`<span class="${c.importe<0?'neg':'pos'}">${plata(c.importe)}</span>`},
          esc(c.recibo ? 'recibo ' + c.recibo
            : c.cheque_nro ? 'cheque Nº' + c.cheque_nro
            : c.factura ? c.factura : c.tipo),
          c.metodo === 'auto' ? '<span class="badge b-mut">automática</span>'
            : '<span class="badge b-ok">a mano</span>',
          `<button class="g xs" onclick="deshacerConciliacion(${c.id},'${
            esc((c.descripcion||'movimiento').slice(0,30))}')">Deshacer</button>`]))}
    </div>` : ''}`);
}
async function conciliarAuto(){
  try{ const r = await post('/api/c/conciliacion/auto', {});
    toast(`${r.conciliados} conciliada(s) · ${r.ambiguos} ambigua(s) · ${r.sin_candidato} sin candidato`);
    vTesoreria();
  }catch(e){ toast(e.message, true); }
}
async function conciliarManual(mid, tipo, id){
  try{ await post('/api/c/conciliacion/manual', {movimiento_id:mid, tipo, id});
    toast('Conciliado — y quedó el recibo'); vTesoreria(); }catch(e){ toast(e.message, true); }
}

/* ══ EL PANEL ══
   Cómo está el equipo, qué servicios corren y qué se puede correr.
   Lección del panel del ERP: sin registro de las corridas no se puede
   contestar "¿esto se corrió?" ni "¿por qué falló?" — por eso el historial
   vive en la base y no se pierde al apagar. */
const RUBROS_JOB = {impuestos:'Impuestos — ARCA y las provincias', bancos:'Bancos — extractos y cheques'};
/* Los nombres de cada hueco. Cada uno dice POR QUÉ importa —eso viene del
   servidor—: "faltan datos" no mueve a nadie, "sin CUIT no entra en la DJ" sí. */
const HUECOS = {
  entidades_sin_cuit: 'Entidades sin CUIT',
  entidades_sin_condicion_iva: 'Entidades sin condición frente al IVA',
  cuentas_sin_cbu: 'Cuentas sin CBU',
  cuentas_sin_tipo: 'Cuentas sin tipo (CA/CC)',
  cuentas_sin_banco_del_maestro: 'Cuentas con el banco sin resolver',
  ventas_sin_actividad: 'Ventas sin actividad de IIBB',
  tributos_sin_clasificar: 'Facturas con tributos sin clasificar',
  retenciones_sin_certificado: 'Retenciones sin número de certificado',
  cheques_sin_librador: 'Cheques en cartera sin librador',
};

async function vPanel(){
  cargando('Panel');
  const [p, js, hu] = await Promise.all([api('/api/panel'), api('/api/jobs'),
    api('/api/c/maestros/incompletos').catch(() => null)]);
  if (js.error) return pintar(`<h2>Panel</h2><div class="vacio">${esc(js.error)}</div>`);
  const d = p.datos;
  pintar(`
    <h2>Panel</h2>
    <div class="sub">El estado del equipo y todo lo que se puede correr.
      Los jobs marcados <b>atendido</b> abren una ventana y esperan que entres vos (2FA o captcha).</div>

    ${hu ? `<div class="panel"><div class="panel-h"><b>Lo que falta completar en las bases</b>
      <span class="mini">${hu.total_huecos} hueco(s) de ${esc(CLI.alias)}</span></div>
      <div class="panel-b">
        <div class="mini" style="margin-bottom:10px">Se ve todo junto y se completa de a poco,
          en vez de descubrir que falta un CUIT el día que hay que presentar. Cada línea dice
          por qué importa.</div>
        ${hu.total_huecos ? Object.entries(HUECOS).filter(([k]) => hu[k]?.total).map(([k,t]) => `
          <div class="cand" style="display:block">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
              <b>${esc(t)}</b><span class="badge b-warn">${hu[k].total}</span></div>
            <div class="mini" style="margin-top:4px">${esc(hu[k].por_que)}</div>
          </div>`).join('')
          : '<div class="vacio">Nada pendiente: las bases están completas.</div>'}
      </div></div>` : ''}

    <div class="panel"><div class="panel-h"><b>Servicios</b>
      <span class="mini">${esc(p.equipo.maquina)} · ${esc(p.equipo.usuario)}</span></div>
      ${tabla(['Servicio','Puerto','Estado','Nota'],
        p.servicios.map(s => [
          `<b>${esc(s.nombre)}</b>${s.propio ? '' : ' <span class="badge b-mut">otro sistema</span>'}`,
          s.puerto,
          s.vivo ? '<span class="badge b-ok">prendido</span>'
                 : '<span class="badge b-mut">apagado</span>',
          `<span class="mini">${esc(s.nota)}</span>`]))}
    </div>

    <div class="grid">
      <div class="card"><div class="k">Clientes</div><div class="v">${d.clientes}</div></div>
      <div class="card"><div class="k">Facturas</div><div class="v">${d.facturas}</div></div>
      <div class="card"><div class="k">Movimientos</div><div class="v">${d.movimientos}</div>
        <div class="mini ${d.sin_conciliar ? 'neg' : ''}">${d.sin_conciliar} sin conciliar</div></div>
      <div class="card"><div class="k">Cheques</div><div class="v">${d.cheques}</div></div>
      <div class="card"><div class="k">Entidades en el maestro</div><div class="v">${d.entidades}</div></div>
      <div class="card"><div class="k">Base</div><div class="v sm">${p.base.mb} MB</div>
        <div class="mini">${esc(p.base.ruta)}</div></div>
    </div>

    <div class="panel" style="margin-top:16px${p.respaldo.avisar ? ';border-left:3px solid var(--bad)' : ''}">
      <div class="panel-h"><b>Respaldo de la base</b>
        <button class="${p.respaldo.avisar ? '' : 'g'} xs" onclick="respaldar(this)">Respaldar ahora</button></div>
      <div class="panel-b">
        <div class="${p.respaldo.avisar ? 'neg' : 'pos'}"><b>${esc(p.respaldo.mensaje)}</b></div>
        <div class="mini" style="margin-top:5px">
          ${p.respaldo.hay ? `${p.respaldo.copias} copia(s) guardadas · última de ${p.respaldo.mb} MB<br>` : ''}
          Carpeta: <code>${esc(p.respaldo.carpeta || (p.drive.ruta + '\respaldo'))}</code>
          ${p.drive.montado ? '' : ' <span class="badge b-bad">el Drive no está montado</span>'}
        </div>
        <div class="mini" style="margin-top:7px">Se respalda solo al arrancar el sistema.
          La base <b>no</b> vive en el Drive —un SQLite adentro de una carpeta que sincroniza
          se corrompe—: solo suben las copias.</div>
      </div>
    </div>

    ${p.faltan.length ? `<div class="panel" style="margin-top:16px;border-left:3px solid var(--warn)">
      <div class="panel-h"><b>Falta cargar — sin esto los jobs no pueden entrar solos</b></div>
      ${tabla(['Qué falta','Fuente','Cliente','Cómo se carga'],
        p.faltan.map(f => [esc(f.que), esc(f.fuente || '—'), esc(f.alias || '—'),
          f.que === 'credencial'
            ? `<code class="mini">py parsers/credenciales.py --set --fuente ${esc(f.fuente)} --alias ${esc(f.alias)}</code>`
            : '<span class="mini">se pone en C:\SIBRA\estudio\</span>']))}
    </div>` : ''}

    ${Object.entries(RUBROS_JOB).map(([r, titulo]) => {
      const del = js.filter(j => j.rubro === r);
      if (!del.length) return '';
      return `<div class="panel"><div class="panel-h"><b>${titulo}</b></div>
        <div class="panel-b">${del.map(j => tarjetaJob(j)).join('')}</div></div>`;
    }).join('')}

    <div class="panel"><div class="panel-h"><b>Últimas corridas</b>
      <button class="g xs" onclick="vPanel()">Actualizar</button></div>
      <div id="jb-corridas"><div class="vacio">—</div></div>
    </div>`);
  verCorridas();
}
function tarjetaJob(j){
  const u = j.ultima_corrida;
  const faltan = j.clientes.filter(c => c.credencial === false).map(c => c.alias);
  return `<div class="cand" style="display:block;margin-bottom:9px">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:230px">
        <b>${esc(j.titulo)}</b>
        ${j.atendido ? '<span class="badge b-warn" style="margin-left:6px">atendido</span>' : ''}
        ${j.existe ? '' : '<span class="badge b-bad" style="margin-left:6px">falta el archivo</span>'}
        <span class="badge b-mut" style="margin-left:6px">${esc(j.origen)}</span>
        <div class="mini" style="margin-top:3px">${esc(j.desc)}</div>
        ${faltan.length ? `<div class="mini neg">sin credencial: ${faltan.map(esc).join(', ')}</div>` : ''}
        ${u ? `<div class="mini">última corrida ${esc(u.inicio.replace('T',' '))} ·
          ${u.estado === 'corriendo' ? '<span class="amb">corriendo…</span>'
            : u.estado === 'ok' ? '<span class="pos">terminó bien</span>' : '<span class="neg">falló</span>'}
          ${u.estado !== 'corriendo' ? `· <a href="#" onclick="verSalida('${u.id}');return false">ver salida</a>` : ''}
        </div>` : ''}
      </div>
      <div class="row-act" style="align-items:center">
        ${j.args.includes('--alias') ? `<select id="jb-alias-${j.clave}" style="width:auto;min-width:130px">
          ${j.clientes.map(c => `<option value="${esc(c.alias)}"${CLI && c.alias===CLI.alias?' selected':''}>${esc(c.alias)}</option>`).join('')}
        </select>` : ''}
        ${j.args.includes('--periodo') ? `<input id="jb-per-${j.clave}" value="${periodoHoy()}"
          style="width:100px" placeholder="MM/AAAA">` : ''}
        <button class="xs" ${j.existe?'':'disabled'} onclick="correrJob('${j.clave}', ${JSON.stringify(j.args).replace(/"/g,'&quot;')})">Correr</button>
      </div>
    </div>
  </div>`;
}
async function correrJob(clave, argsDef){
  const args = {};
  if (argsDef.includes('--alias')) args['--alias'] = $('#jb-alias-'+clave)?.value;
  if (argsDef.includes('--periodo')) args['--periodo'] = $('#jb-per-'+clave)?.value;
  try{
    const r = await post(`/api/jobs/${clave}/correr`, {args});
    toast('Job lanzado — si es atendido, mirá la ventana que se abre');
    seguir(r.id);
  }catch(e){ toast(e.message, true); }
}
async function seguir(cid){
  for (let i = 0; i < 600; i++){
    await new Promise(r => setTimeout(r, 2000));
    let c; try{ c = await api('/api/jobs/corrida/' + cid); }catch(e){ return; }
    if (!c || c.estado === 'corriendo') { if (location.hash === '#panel') verCorridas(); continue; }
    toast(c.estado === 'ok' ? 'El job terminó bien' : 'El job falló — mirá la salida', c.estado !== 'ok');
    if (location.hash === '#panel') { vPanel(); verSalida(cid); }
    return;
  }
}
async function verCorridas(){
  const c = $('#jb-corridas'); if (!c) return;
  const cs = await api('/api/jobs/corridas').catch(() => []);
  c.innerHTML = cs.length ? tabla(['Arrancó','Job','Sobre','Duró','Quién','Estado',''],
    cs.map(x => [esc((x.inicio||'').replace('T',' ')), esc(x.job),
      `<span class="mini">${esc(x.alias || '—')}</span>`,
      x.segundos == null ? '—' : (x.segundos < 60 ? x.segundos + 's'
        : Math.round(x.segundos/60) + ' min'),
      `<span class="mini">${esc(x.usuario || '—')}</span>`,
      x.estado === 'corriendo' ? '<span class="badge b-warn">corriendo</span>'
        : x.estado === 'ok' ? '<span class="badge b-ok">ok</span>' : '<span class="badge b-bad">falló</span>',
      `<button class="g xs" onclick="verSalida(${x.id})">Salida</button>`]))
    : '<div class="vacio">Todavía no se corrió ningún job.</div>';
}
async function verSalida(cid){
  const c = await api('/api/jobs/corrida/' + cid);
  const cont = $('#jb-corridas'); if (!cont) return;
  cont.insertAdjacentHTML('afterbegin', `
    <div class="panel-b" style="border-bottom:1px solid var(--bor2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <b>${esc(c.job)} · ${esc(c.inicio.replace('T',' '))}</b>
        <button class="g xs" onclick="this.closest('div.panel-b').remove()">Cerrar</button></div>
      <pre style="background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:11px;
        overflow:auto;max-height:340px;font-size:12px;white-space:pre-wrap">${esc(c.salida || '(sin salida)')}</pre>
    </div>`);
}

async function respaldar(btn){
  btn.disabled = true; btn.textContent = 'Respaldando…';
  try{
    const r = await post('/api/respaldo', {});
    toast(r.ok ? `Copia hecha (${r.mb} MB) — ${r.detalle}` : r.error, !r.ok);
  }catch(e){ toast(e.message, true); }
  vPanel();
}

      ${cs.length ? tabla(['Alias','Razón social','CUIT','Jurisdicciones','Alta',''],

          esc(c.jurisdicciones||'—'), fecha(c.alta),
          CLI && c.alias === CLI.alias ? '<span class="badge b-ok">viendo ahora</span>'

async function altaCliente(){
  try{
    await post('/api/clientes', {cuit: val('nc-cuit'), alias: val('nc-alias'),
      razon_social: val('nc-rs'), condicion_iva: val('nc-iva')});
    toast('Cliente creado');
